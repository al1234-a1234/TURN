<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورشة إيت — EIGHT DESIGN STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf-base" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Alexandria:wght@100;300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Literata:opsz,wght@7..72,200..900&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   STUDIO UI — واجهة الورشة. داكنة محايدة عمدًا: لا تشبه التطبيق
   ولا تخدع العين عن ألوانه. لا تستعمل أي توكن من توكنات التطبيق.
   ══════════════════════════════════════════════════════════════ */
:root{
  --u-bg:#0e0e10; --u-bg2:#151518; --u-bg3:#1c1c20; --u-line:#2a2a30;
  --u-ink:#e7e7ea; --u-dim:#8d8d97; --u-dim2:#6a6a73; --u-acc:#6f9dd6; --u-warn:#d8a657; --u-bad:#d16b6b; --u-good:#6fbf8b;
  --u-r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--u-bg);color:var(--u-ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:12.5px;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1.5px solid var(--u-acc);outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#33333b;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── الشريط العلوي ── */
#top{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;background:var(--u-bg2);
  border-bottom:1px solid var(--u-line);flex:none;overflow-x:auto}
#top .logo{font-weight:700;font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
#top .rev{font-size:10.5px;color:var(--u-dim2);font-family:ui-monospace,monospace;direction:ltr}
.tbtn{border:1px solid var(--u-line);border-radius:var(--u-r);padding:5px 9px;font-size:11.5px;color:var(--u-dim);white-space:nowrap}
.tbtn:hover{color:var(--u-ink);border-color:#3c3c45}
.tbtn.on{background:#26262c;color:var(--u-ink);border-color:#43434f}
.sep{width:1px;height:20px;background:var(--u-line);flex:none}
.grow{flex:1}

/* ── التخطيط ── */
#main{display:flex;height:calc(100% - 44px);align-items:stretch}
#insp{width:326px;flex:none;display:flex;flex-direction:column;background:var(--u-bg2);border-inline-end:1px solid var(--u-line);min-width:0}
#stagewrap{flex:1;min-width:0;position:relative;overflow:auto;background:
  linear-gradient(0deg,rgba(255,255,255,.014) 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px) 0 0/22px 22px, #0b0b0d}
#ctrl{width:482px;flex:none;display:flex;background:var(--u-bg2);border-inline-start:1px solid var(--u-line);min-width:0}
.rsz{width:5px;cursor:col-resize;background:transparent;flex:none}
.rsz:hover{background:#2f2f38}
.collapsed{display:none!important}

/* ── لوحة التحكم ── */
#ctabs{width:96px;flex:none;border-inline-start:1px solid var(--u-line);overflow-y:auto;padding:6px 0;background:#101013}
#ctabs button{display:block;width:100%;text-align:start;padding:8px 10px;font-size:11.5px;color:var(--u-dim);border-inline-start:2px solid transparent}
#ctabs button.on{color:var(--u-ink);background:#1e1e24;border-inline-start-color:var(--u-acc)}
#cbody{flex:1;overflow-y:auto;padding:10px 12px 60px;min-width:0}

/* ── عناصر اللوحات ── */
.sec{border:1px solid var(--u-line);border-radius:10px;margin-bottom:9px;overflow:hidden;background:var(--u-bg3)}
.sec>h4{margin:0;padding:8px 10px;font-size:11.5px;font-weight:600;color:var(--u-ink);background:#202027;
  display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.sec>h4 .cnt{margin-inline-start:auto;font-size:10px;color:var(--u-dim2);font-family:ui-monospace,monospace}
.sec>.body{padding:8px 10px}
.sec.closed>.body{display:none}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px;align-items:center;padding:4px 0;min-height:28px}
.row>label{font-size:11.5px;color:var(--u-dim);overflow:hidden;cursor:default;line-height:1.5}
.lockb{font-size:9px;opacity:.5;margin-inline-end:3px;padding:0;background:none;border:0;vertical-align:1px}
.lockb:hover{opacity:1}
.row>label b{color:var(--u-ink);font-weight:500}
.ctl{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.ctl input[type=range]{width:96px;min-width:52px;max-width:96px;accent-color:var(--u-acc)}
.ctl input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--u-line);border-radius:5px;background:none}
.row>label{align-self:start;padding-top:3px}
/* input.num لا .num المجرّدة: المعاينة نفسها تستعمل .num لرقم التذكرة (div)،
   والقاعدة المجرّدة كانت تتسرّب إليه فتصبغه بخلفية الورشة الداكنة. */
input.num{width:56px;background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:3px 5px;font-size:11px;
  font-family:ui-monospace,monospace;direction:ltr;text-align:center}
.txt{width:100%;background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:5px 7px;font-size:11.5px}
.uni{background:#0f0f12;max-width:52px;border:1px solid var(--u-line);border-radius:6px;padding:3px;font-size:10.5px}
input[type=range]{width:118px;accent-color:var(--u-acc);background:transparent}
input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--u-line);border-radius:5px;background:#0f0f12;cursor:pointer}
.hex{width:78px;background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:3px 5px;font-size:10.5px;
  font-family:ui-monospace,monospace;direction:ltr;text-align:center}
.sel{background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:3px 5px;font-size:11px;max-width:150px}
.chk{width:15px;height:15px;accent-color:var(--u-acc)}
.mini{font-size:10px;color:var(--u-dim2);line-height:1.7}
.mini code{font-family:ui-monospace,monospace;color:#a9b7c9;direction:ltr}
.hint{font-size:10.5px;color:var(--u-dim2);line-height:1.75;padding:4px 0 6px}
.pillrow{display:flex;flex-wrap:wrap;gap:5px;padding:3px 0}
/* منتقي الخطّ */
.fontbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:150px;max-width:190px;
  background:#0f0f12;border:1px solid var(--u-line);border-radius:7px;padding:4px 8px;text-align:start;overflow:hidden}
.fontbtn:hover{border-color:var(--u-acc)}
.fontbtn .fbn{font-size:13px;line-height:1.25;color:var(--u-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fontbtn .fbt{font-size:9px;color:var(--u-dim2)}
.fmenu{position:fixed;z-index:600;width:390px;max-height:452px;display:flex;flex-direction:column;gap:6px;
  background:#141418;border:1px solid var(--u-line);border-radius:12px;padding:9px;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.85)}
.fmenu .flist{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:3px;min-height:120px}
.fmenu .frow{border:1px solid transparent;border-radius:8px;padding:6px 8px;cursor:pointer}
.fmenu .frow:hover{background:#1d1d23;border-color:#2c2c34}
.fmenu .frow.on{background:#2e3a48;border-color:var(--u-acc)}
.fmenu .frow .fn{font-size:16px;line-height:1.3;color:#f2f2f4}
.fmenu .frow .ftag{font-size:9px;color:var(--u-dim2);margin-top:1px}
.fmenu .frow .fsample{font-size:13px;color:#c9c9d0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmenu .frow .fnote{font-size:9.5px;color:var(--u-dim2);line-height:1.6;margin-top:2px}
.fmfoot{border-top:1px solid var(--u-line);padding-top:6px;display:flex;flex-direction:column;gap:4px}
#fontwarn{display:none;background:#3a1f1f;color:#e6a1a1;border:1px solid #5a2e2e;border-radius:6px;
  padding:2px 7px;font-size:10px}
/* شرح تحت كل عنصر تحكّم */
.row>.fdesc,.row>.mini{grid-column:1/-1}
.fdesc{font-size:10px;color:var(--u-dim2);line-height:1.75;padding:1px 0 5px;border-bottom:1px dashed #232329;margin-bottom:3px}
.fdesc b{color:#b9c4d2;font-weight:500}
.fdesc .where{color:#8fa5bd}
.fdesc .show{white-space:nowrap}
/* المحرّر على الشاشة */
.elpop{position:fixed;z-index:620;width:330px;max-height:76vh;overflow-y:auto;
  background:#15151a;border:1px solid var(--u-acc);border-radius:12px;padding:9px;
  box-shadow:0 26px 64px -20px rgba(0,0,0,.9)}
.elpop .ephd{display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--u-line);margin-bottom:6px}
.elpop .ephd b{flex:1;font-size:12.5px;color:#fff;font-family:ui-monospace,monospace;direction:ltr;text-align:start}
.elpop .epx{background:none;border:0;color:var(--u-dim2);font-size:13px;padding:0 3px}
.elpop .eplink{background:none;border:0;color:var(--u-acc);font-size:10.5px;text-decoration:underline}
.elpop .epnav{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 0 6px;
  border-bottom:1px dashed #232329;margin-bottom:5px}
.elpop .epnav .pill{font-size:9.5px;padding:3px 7px;font-family:ui-monospace,monospace;direction:ltr}
.elpop .epnud{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:5px 0;border-top:1px dashed #232329;margin-top:5px}
.elpop .epbody{border-top:1px dashed #232329;margin-top:6px;padding-top:4px}
.elpop .epident{border-top:1px dashed #232329;margin-top:6px;padding-top:5px}
.swrow{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.sw{width:17px;height:17px;border-radius:5px;border:1px solid #34343c;padding:0;flex:none}
.sw:hover{outline:1px solid var(--u-acc)}
.sw-none{background:#0f0f12;color:var(--u-dim2);font-size:10px;line-height:1}
.elpop .row{grid-template-columns:96px minmax(0,1fr)}
.elpop .fdest{display:none}
@media (max-width:900px){.elpop{width:auto;inset-inline:8px;left:8px!important;max-height:62vh}}
.fdest{margin-top:2px;font-size:9.5px;line-height:1.7}
.fdest code{font-family:ui-monospace,monospace;direction:ltr;unicode-bidi:isolate;color:#c8b487}
.dest{color:#7f8ba0}.dest b{color:#a9b7c9}
.d-var{color:#7ba88b}.d-var b{color:#9ad4b1}
.d-rule{color:#8593ab}.d-rule b{color:#adbcd4}
.d-util{color:#a2916b}.d-util b{color:#e2c68d}
.d-lock{color:#b08484}.d-lock b{color:#e6a1a1}
.dnone{color:#a06060}
.fdesc .show{color:var(--u-acc);text-decoration:underline;cursor:pointer;background:none;border:0;font-size:10px;padding:0 3px}
body.nodesc .fdesc{display:none}
.flash{animation:flashk 1.1s ease 2}
@keyframes flashk{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #ffb020,0 0 0 9999px rgba(0,0,0,.28)}}
.pill{border:1px solid var(--u-line);border-radius:99px;padding:4px 9px;font-size:10.5px;color:var(--u-dim)}
.pill:hover{color:var(--u-ink);border-color:#454550}
.pill.on{background:#2b2b33;color:#fff;border-color:#50505d}
.warnbox{border:1px solid #4a3a22;background:#241d12;border-radius:8px;padding:7px 9px;font-size:11px;color:#e2c68d;line-height:1.8;margin-bottom:6px}
.badbox{border:1px solid #4a2626;background:#241414;border-radius:8px;padding:7px 9px;font-size:11px;color:#e6a1a1;line-height:1.8;margin-bottom:6px}
.goodbox{border:1px solid #24422f;background:#12211a;border-radius:8px;padding:7px 9px;font-size:11px;color:#9ad4b1;line-height:1.8}
.exc{color:var(--u-warn);font-size:9.5px;margin-inline-start:4px}
.lnk{color:var(--u-acc);font-size:10.5px;text-decoration:underline;cursor:pointer;background:none;border:0}

/* ── المفتش ── */
#insp .hd{padding:8px 11px;border-bottom:1px solid var(--u-line);display:flex;align-items:center;gap:7px;flex:none}
#insp .hd b{font-size:11.5px}
#ibody{overflow-y:auto;padding:9px 11px;flex:1;min-height:120px}
#codewrap{border-top:1px solid var(--u-line);display:flex;flex-direction:column;height:44%;flex:none;min-height:0}
#codetabs{display:flex;gap:2px;padding:5px 7px;border-bottom:1px solid var(--u-line);overflow-x:auto;flex:none;background:#101013}
#codetabs button{padding:4px 7px;border-radius:6px;font-size:10.5px;color:var(--u-dim);white-space:nowrap}
#codetabs button.on{background:#26262c;color:#fff}
#code{flex:1;overflow:auto;margin:0;padding:9px 11px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:10.5px;
  line-height:1.75;color:#c8cfd8;white-space:pre;direction:ltr;text-align:left;background:#0b0b0d}
#codebar{display:flex;gap:5px;padding:6px 7px;border-top:1px solid var(--u-line);flex:none;align-items:center;flex-wrap:wrap}

/* ── شجرة العناصر ── */
.tree{font-size:11px;line-height:1.5}
.tree .tr{display:flex;align-items:center;gap:4px;padding:2.5px 3px;border-radius:5px;cursor:pointer}
.tree .tr:hover{background:#232329}
.tree .tr.on{background:#2e3a48;color:#fff}
.tree .tr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-family:ui-monospace,monospace;font-size:10px}
.tree .tr .ic{width:16px;text-align:center;font-size:10px;color:var(--u-dim2);flex:none}
.tree .tr .ic:hover{color:#fff}

/* ── المسرح ── */
#stage{padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100%;
  transform-origin:top center}
.frame{width:390px;height:844px;border-radius:38px;overflow:hidden;position:relative;background:#000;
  border:1px solid #3a3a42;box-shadow:0 30px 70px -38px rgba(0,0,0,.95);flex:none}
.frame.se{width:375px;height:667px}
.frame.px{width:412px;height:915px}
.frame.tb{width:744px;height:1024px}
.fcap{font-size:10.5px;color:var(--u-dim2);text-align:center}
#sheet{display:none;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
#sheet.on{display:flex}
#sheet .cell{display:flex;flex-direction:column;gap:6px;align-items:center}
#sheet .frame{transform-origin:top center}
#abwrap{display:none;gap:16px;align-items:flex-start}
#abwrap.on{display:flex}
#single.off{display:none}
.splitwrap{position:relative}
.splitwrap .over{position:absolute;inset:0;overflow:hidden;border-radius:38px;pointer-events:none}
.splitwrap .handle{position:absolute;top:0;bottom:0;width:2px;background:var(--u-acc);cursor:ew-resize;z-index:9}
.splitwrap .handle:after{content:"";position:absolute;top:50%;inset-inline-start:-11px;width:24px;height:24px;border-radius:50%;
  background:var(--u-acc);transform:translateY(-50%)}

/* ── طبقات القياس فوق المعاينة ── */
.ovl{position:absolute;inset:0;pointer-events:none;z-index:40}
.ovl.grid8{background:
  linear-gradient(0deg,rgba(0,120,255,.16) 1px,transparent 1px) 0 0/100% 8px,
  linear-gradient(90deg,rgba(0,120,255,.16) 1px,transparent 1px) 0 0/8px 100%}
.ovl.cols{background:repeating-linear-gradient(90deg,rgba(255,0,90,.10) 0 calc((100% - 5*20px)/6),transparent 0 calc((100% - 5*20px)/6 + 20px))}
.ovl.base{background:repeating-linear-gradient(0deg,transparent 0 19px,rgba(0,255,180,.22) 19px 20px)}
.ovl.safe:before,.ovl.safe:after{content:"";position:absolute;inset-inline:0;background:rgba(255,180,0,.13)}
.ovl.safe:before{top:0;height:47px}.ovl.safe:after{bottom:0;height:34px}
.hoverbox{position:absolute;border:1px solid #4d9cff;background:rgba(77,156,255,.08);pointer-events:none;z-index:41;border-radius:3px}
.selbox{position:absolute;border:1.5px solid #ffb020;pointer-events:none;z-index:42;border-radius:3px;box-shadow:0 0 0 9999px rgba(0,0,0,.0)}
.elbadge{position:absolute;z-index:43;background:#ffb020;color:#241a00;font-size:9px;font-family:ui-monospace,monospace;
  padding:1px 4px;border-radius:3px;pointer-events:none;white-space:nowrap;direction:ltr}
.boxmodel .pd{position:absolute;background:rgba(140,220,120,.22);pointer-events:none;z-index:39}
.rulerline{position:absolute;background:#ff5aa7;z-index:44;pointer-events:none}
.rulertag{position:absolute;z-index:45;background:#ff5aa7;color:#2a0014;font-size:9px;padding:1px 4px;border-radius:3px;
  font-family:ui-monospace,monospace;pointer-events:none}
.touchbad{position:absolute;outline:1.5px dashed #ff5a5a;z-index:41;pointer-events:none;border-radius:4px}
#stage.gs .frame{filter:grayscale(1)}
#stage.cb-p .frame{filter:url(#cbP)}
#stage.cb-d .frame{filter:url(#cbD)}
#stage.cb-t .frame{filter:url(#cbT)}

/* ── حالة السحب ── */
.dragging{opacity:.4}
.dropline{position:absolute;background:var(--u-acc);z-index:46;pointer-events:none;border-radius:2px}
.snapline{position:absolute;background:#ff5aa7;z-index:46;pointer-events:none}
.measbadge{position:absolute;z-index:47;background:#111418;color:#dfe7f2;border:1px solid #4d9cff;
  font-size:9.5px;padding:2px 6px;border-radius:5px;pointer-events:none;white-space:nowrap;
  font-family:ui-monospace,monospace;direction:ltr}
.measbadge b{color:#8fd0ff}
body.editing .app *{cursor:crosshair}
body.freemove .app [data-el].fmsel{cursor:move}

/* ── لوحة الأوامر ── */
#cmdk{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;padding-top:12vh;justify-content:center}
#cmdk.on{display:flex}
#cmdk .box{width:min(620px,92vw);height:min(440px,70vh);background:var(--u-bg2);border:1px solid var(--u-line);
  border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#cmdk input{border:0;border-bottom:1px solid var(--u-line);background:transparent;padding:12px 14px;font-size:14px;outline:0}
#cmdk .list{overflow-y:auto;padding:5px}
#cmdk .it{padding:7px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;display:flex;gap:8px;align-items:center}
#cmdk .it:hover,#cmdk .it.on{background:#2a2a33}
#cmdk .it .id{font-family:ui-monospace,monospace;font-size:10px;color:var(--u-dim2);direction:ltr;margin-inline-start:auto}

/* ── توست الورشة ── */
#utoast{position:fixed;bottom:16px;inset-inline-start:50%;transform:translateX(50%) translateY(10px);background:#26262e;
  border:1px solid var(--u-line);color:#fff;padding:8px 14px;border-radius:9px;font-size:11.5px;z-index:300;opacity:0;
  transition:.2s;pointer-events:none}
#utoast.on{opacity:1;transform:translateX(50%)}

/* ══════════════════════════════════════════════════════════════
   APP — التطبيق. منقول حرفيًّا من خط الأساس، وكل قيمة صلبة
   استُبدلت بمتغيّر توكن. صفر أرقام وألوان مكتوبة هنا.
   ══════════════════════════════════════════════════════════════ */
.app{
  position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  color:var(--s-ink);
  font-family:var(--c-font-ui);
  font-size:var(--c-base-size);
  line-height:var(--c-base-lh);
  font-weight:var(--c-base-weight);
  letter-spacing:var(--c-base-tracking);
  word-spacing:var(--c-base-word);
  font-variant-numeric:var(--c-numeric);
  font-feature-settings:var(--c-font-features);
  font-variation-settings:var(--x-font-vf);
  font-optical-sizing:var(--c-font-opsz-auto);
  text-rendering:var(--c-text-rendering);

const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const round=(v,n)=>{const m=Math.pow(10,n==null?3:n);return Math.round(v*m)/m};
function toast(t){const u=$('#utoast');u.textContent=t;u.classList.add('on');clearTimeout(window._ut);
  window._ut=setTimeout(()=>u.classList.remove('on'),1800)}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function rgba(h,a){if(a>=1)return h;const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${round(a,3)})`}
function lum(h){const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){const l1=lum(a),l2=lum(b);return round((Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05),2)}
function hex2hsl(h){let[r,g,b]=hex2rgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let hu=0,s=0,l=(mx+mn)/2;const d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);
    hu=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hu*=60}
  return[hu,s*100,l*100]}
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return rgb2hex(f(0)*255,f(8)*255,f(4)*255)}

/* ══════════════════════════════════════════════════════════════
   ٢) محرّك التوكنات — القراءة والحلّ والحقن
   ══════════════════════════════════════════════════════════════ */
function raw(id){const t=TOK[id];if(!t)return'';return t.ref?raw(t.ref):t.v}
function alphaOf(id){const t=TOK[id];if(!t)return 1;return t.ref?alphaOf(t.ref):(t.a==null?1:t.a)}
function out(id){
  const t=TOK[id];if(!t)return'';
  const v=raw(id);
  switch(t.t){
    case'color':return rgba(v,alphaOf(id));
    case'dim':return t.u===''?String(v):v+t.u;
    case'dur':return v+'s';
    case'num':case'opacity':case'lh':return String(v);
    case'bool':return v?'1':'0';
    case'shadow':return v.length?v.map(s=>`${s.inset?'inset ':''}${s.x}px ${s.y}px ${s.b}px ${s.s}px ${rgba(s.c,s.a)}`).join(','):'none';
    default:return String(v);
  }
}
/* المتغيّرات المشتقّة: ما لا يُختزل في توكن واحد */
function texture(k,tintHex){
  const L=[],g=n=>+raw('c.tex.'+k+'.'+n);
  const gl=g('glow');if(gl>0)L.push(`radial-gradient(circle at 18% 12%,${rgba(tintHex,gl)},transparent 42%)`);
  const dg=g('diag');if(dg>0){const a=raw('c.tex.'+k+'.diag.angle'),s=+raw('c.tex.'+k+'.diag.size');
    L.push(`repeating-linear-gradient(${a}deg,${rgba(tintHex,dg)} 0 ${round(s*.4,2)}px,transparent ${round(s*.4,2)}px ${s}px)`)}
  const gr=g('grain');if(gr>0)L.push(`radial-gradient(rgba(0,0,0,${gr}) .7px,transparent .8px) 0 0/3px 3px`);
  const pa=g('paper');if(pa>0)L.push(`repeating-linear-gradient(0deg,${rgba(tintHex,pa)} 0 1px,transparent 1px 4px)`,
    `repeating-linear-gradient(90deg,${rgba(tintHex,pa*.6)} 0 1px,transparent 1px 6px)`);
  const li=g('linen');if(li>0)L.push(`repeating-linear-gradient(45deg,${rgba(tintHex,li)} 0 1px,transparent 1px 3px)`,
    `repeating-linear-gradient(-45deg,${rgba(tintHex,li)} 0 1px,transparent 1px 3px)`);
  return L}
/* ظلّ من توكن ظلّ، بنفس صبغة بقيّة الظلال */
function shadowOf(id){const S=TOK[id].v;if(!S||!S.length)return'none';
  const tint=+raw('c.shadow.tint');
  return S.map(s=>{const c=mixTint(s.c,tint);
    return`${s.inset?'inset ':''}${s.x}px ${s.y}px ${s.b}px ${s.s}px ${rgba(c,s.a)}`}).join(',')}
/* صورة: المرفوعة إن وُجدت، وإلا بديل متدرّج من لون الهوية */
function photoBG(id,shift,lift){const v=raw(id);
  if(v)return`url("${v}")`;
  const h=(+raw('c.photo.hue')+(shift||0))%360,sa=+raw('c.photo.sat')*100,L=lift||0;
  return`linear-gradient(155deg,${hsl2hex(h,sa*.7,74+L*.5)},${hsl2hex(h,sa,52+L)} 58%,${hsl2hex(h,sa*1.1,34+L)})`}

  '--x-chip-tint':()=>rgba(raw('s.brand'),.09),
  '--x-wm-comp':()=>raw('c.wordmark.compensate')?(-raw('c.wordmark.tracking'))+'em':'0em',

  '--x-digit-sm':()=>round(+raw('c.digit.size')*1.0,4)+'em',
  '--x-word-sm':()=>round(+raw('c.logoword.size')*1.0,4)+'em',
  '--x-hd-dir':()=>raw('c.hd.reverse')?'row-reverse':'row',
  '--x-row-dir':()=>raw('c.row.reverse')?'row-reverse':'row',
  '--x-nav-dir':()=>raw('c.nav.reverse')?'row-reverse':'row',
  '--x-tick-dir':()=>raw('c.ticket.reverse')?'row-reverse':'row',
};
function mixTint(hex,t){/* يسحب الظلّ نحو لون العلامة بدل الأسود المحايد */
  const b=hex2rgb(hex),br=hex2rgb(raw('s.brand'));
  return rgb2hex(b[0]+(br[0]-b[0])*t*.35,b[1]+(br[1]-b[1])*t*.35,b[2]+(br[2]-b[2])*t*.35)}

let ROOTS=[];
function apply(target){
  const nodes=target?[target]:ROOTS;
  for(const n of nodes){
    for(const id of ORDER)n.style.setProperty(cssvar(id),out(id));
    for(const k in COMPUTED)n.style.setProperty(k,COMPUTED[k]());
    /* تكبير النص العام وكثافة الحبر */
    n.style.setProperty('--c-base-size',round(+raw('c.base.size')*(+raw('c.type.scale'))/100,3)+'px');
    n.style.setProperty('-webkit-font-smoothing',+raw('c.ink.density')>0?'auto':'antialiased');
  }
}
/* لقطة كاملة للحالة */
function snapshotState(){
  const o={tok:{},struct:JSON.parse(JSON.stringify(STRUCT)),content:JSON.parse(JSON.stringify(DATA)),
    strings:JSON.parse(JSON.stringify(STR)),sig:JSON.parse(JSON.stringify(SIG))};
  for(const id of ORDER){const t=TOK[id];o.tok[id]={v:t.v,a:t.a,ref:t.ref,u:t.u,exc:t.exc||false}}
  return o}
function restoreState(o,silent){
  for(const id in o.tok){
    if(!TOK[id]){/* توكن إزاحة حرّة أُنشئ لاحقًا */ const m=id.match(/^c\.fm\.(.+)\.(x|y)$/);if(m)ensureFM(m[1])}
    if(!TOK[id])continue;const s=o.tok[id],t=TOK[id];t.v=s.v;t.a=s.a;t.ref=s.ref;if(s.u!=null)t.u=s.u;t.exc=s.exc}
  if(o.struct)Object.assign(STRUCT,JSON.parse(JSON.stringify(o.struct)));
  if(o.content){DATA.length=0;JSON.parse(JSON.stringify(o.content)).forEach(x=>DATA.push(x))}
  if(o.strings)Object.assign(STR,o.strings);
  if(o.sig)Object.assign(SIG,o.sig);
  apply();render();buildPanel();if(!silent)refreshCode()}

/* ══════════════════════════════════════════════════════════════
   ٣) البنية — الفتحات والأجزاء (السحب، الإخفاء، الإدراج)
   ══════════════════════════════════════════════════════════════ */
const STRUCT={
  slots:{
    header:[{k:'wordmark',on:1},{k:'badge',on:1},{k:'place',on:1}],
    row:[{k:'chip',on:1},{k:'text',on:1},{k:'status',on:1}],
    nav:[{k:'list',on:1},{k:'turns',on:1},{k:'me',on:1}],
    end:[{k:'ghost',on:1},{k:'endtext',on:1}]
  },
  added:[],  /* {id,slot,kind,props,index} */
  removed:[] /* سجل ما أُخفي — للتصدير */
};
const PARTKINDS={
  text:{l:'نصّ',def:{text:'نصّ جديد'}}, sub:{l:'نصّ ثانوي',def:{text:'سطر ثانوي'}},
  num:{l:'رقم',def:{text:'٨'}}, badge:{l:'شارة الشعار',def:{}}, uplogo:{l:'شعار مرفوع',def:{}},
  icon:{l:'أيقونة',def:{text:'✦'}}, dot:{l:'نقطة حالة',def:{}}, chip:{l:'شريحة',def:{text:'جديد'}},
  btn:{l:'زر أساسي',def:{text:'زر'}}, gbtn:{l:'زر شبحي',def:{text:'زر شبحي'}},
  rule:{l:'فاصل خطّي',def:{}}, spacer:{l:'مساحة فارغة',def:{}}, img:{l:'صورة',def:{}},
  card:{l:'بطاقة',def:{text:'بطاقة'}}, kv:{l:'صف معلومات',def:{text:'تسمية',text2:'قيمة'}},
  head:{l:'مجموعة عنوان',def:{text:'عنوان'}}
};
let PARTSEQ=1;
function addPart(slot,kind){
  const id=kind+'-'+(PARTSEQ++);
  STRUCT.added.push({id:id,slot:slot,kind:kind,props:Object.assign({},PARTKINDS[kind].def)});
  STRUCT.slots[slot].push({k:'ins:'+id,on:1});
  push('إدراج '+PARTKINDS[kind].l);render();buildPanel()}
function delPart(slot,idx){
  const s=STRUCT.slots[slot],p=s[idx];
  if(p.k.startsWith('ins:')){const pid=p.k.slice(4);STRUCT.added=STRUCT.added.filter(a=>a.id!==pid);s.splice(idx,1)}
  else{p.on=0;if(!STRUCT.removed.find(r=>r.slot===slot&&r.k===p.k))STRUCT.removed.push({slot:slot,k:p.k})}
  push('حذف جزء');render();buildPanel()}
function togglePart(slot,idx){
  const p=STRUCT.slots[slot][idx];p.on=p.on?0:1;
  if(!p.on){if(!STRUCT.removed.find(r=>r.slot===slot&&r.k===p.k))STRUCT.removed.push({slot:slot,k:p.k})}
  else STRUCT.removed=STRUCT.removed.filter(r=>!(r.slot===slot&&r.k===p.k));
  push('إظهار/إخفاء');render();buildPanel()}
function movePart(slot,from,to){
  const s=STRUCT.slots[slot];if(to<0||to>=s.length||from===to)return;
  const[x]=s.splice(from,1);s.splice(to,0,x);push('إعادة ترتيب');render();buildPanel()}
function dupPart(slot,idx){
  const p=STRUCT.slots[slot][idx];if(!p.k.startsWith('ins:'))return;
  const src=STRUCT.added.find(a=>a.id===p.k.slice(4));const id=src.kind+'-'+(PARTSEQ++);
  STRUCT.added.push({id:id,slot:slot,kind:src.kind,props:Object.assign({},src.props)});
  STRUCT.slots[slot].splice(idx+1,0,{k:'ins:'+id,on:1});push('تكرار');render();buildPanel()}

  const D=`data-el="ins.${p.id}" data-part="${p.id}"`;
  switch(p.kind){
    case'text':return`<span class="ins-text" ${D}>${t}</span>`;
    case'sub':return`<span class="ins-sub" ${D}>${t}</span>`;
    case'num':return`<span class="ins-num" ${D}>${t}</span>`;
    case'badge':return BADGE('sm','ins.'+p.id);
    case'uplogo':return`<span class="b8 plain" ${D}>${raw('c.uplogo.src')?`<img src="${raw('c.uplogo.src')}" alt="">`:''}</span>`;

/* ══════════════════════════════════════════════════════════════
   الوسم التلقائي — لا يبقى في الشاشة عنصر لا يُضغط.
   ما له مقبض معرَّف يبقى كما هو. وما ليس له يأخذ مقبضًا مشتقًّا من
   صنفه وترتيبه بين إخوته من صنفه — ثابت ما دامت البنية ثابتة، فلا
   تضيع إزاحته عند إعادة الرسم. داخل الـSVG لا يُوسَم: مسارات الشعار
   ليست عناصر تصميم.
   ══════════════════════════════════════════════════════════════ */
function autoTag(root){
  if(!root)return;
  const seen={};
  root.querySelectorAll('*').forEach(n=>{
    if(n.hasAttribute('data-el'))return;
    if(n.closest('svg'))return;
    const r=n.getBoundingClientRect();
    if(r.width<8||r.height<8)return;
    const base=(typeof n.className==='string'&&n.className.trim())
      ? n.className.trim().split(/\s+/)[0] : n.tagName.toLowerCase();
    /* الاسم يصير جزءًا من اسم متغيّر CSS عند التحريك، فلا يُسمح فيه
       إلا بحروف وأرقام وشرطات — وإلا سقط المتغيّر بصمت. */
    const safe=base.replace(/[^a-zA-Z0-9_-]/g,'');
    if(!safe)return;
    seen[safe]=(seen[safe]||0)+1;
    n.dataset.el='a-'+safe+(seen[safe]>1?'-'+seen[safe]:'');
    n.dataset.auto='1'})}
function render(){
  const h=(S.view==='search'?scrSearch():S.view==='gifts'?scrGifts()
    :S.view==='home'?scrHome():S.view==='live'?scrLive():S.view==='qcard'?scrQcard()
    :S.view==='rest'?scrRest():S.view==='confirm'?scrConfirm():S.view==='ticket'?scrTicket()
    :S.tab==='turns'?scrTurns():S.tab==='me'?scrMe():scrList());
  $('#app').innerHTML=h+`<div class="toastr" id="tr"></div>`;
  autoTag($('#app'));
  /* في RTL يبدأ كروم الشريط الأفقي من اليسار — نعيده إلى اليمين */
  $$('#app .bwrap, #app .gal').forEach(n=>{n.scrollLeft=n.scrollWidth});
  applyFreeMove($('#app'));
  if(SHEET)renderSheet();
  if(ABON)renderAB();
  drawSel();}
function applyFreeMove(root){
  FMKEYS.forEach(e=>{const n=root.querySelector(`[data-el="${e}"]`);if(!n)return;
    const x=+raw('c.fm.'+e+'.x'),y=+raw('c.fm.'+e+'.y');
    const r=+raw('c.fm.'+e+'.rot')||0, sc=+raw('c.fm.'+e+'.scale');
    if(x||y){n.style.position='relative';n.style.insetInlineStart=x+'px';n.style.top=y+'px'}
    const t=[];if(r)t.push('rotate('+r+'deg)');
    if(sc&&sc!==1)t.push('scale('+sc+')');
    if(t.length){n.style.transform=t.join(' ');n.style.transformOrigin='center'}})}
function atoast(t){const e=$('#tr');if(!e)return;e.textContent=t;e.classList.add('on');
  clearTimeout(window._at);window._at=setTimeout(()=>e.classList.remove('on'),1900)}

  for(const id in kit.t){const v=kit.t[id];if(!TOK[id])continue;

  apply();render();buildPanel();refreshCode()}

function applyLayout(k){
  const L=LAYOUTS.find(x=>x.k===k);if(!L)return;
  for(const sl in L.slots){
    const want=L.slots[sl];
    const cur=STRUCT.slots[sl]||[];
    /* نحافظ على الأجزاء المُدرَجة يدويًّا ونعيد ترتيب الأصلية فقط */
    const ins=cur.filter(x=>x.k.startsWith('ins:'));
    STRUCT.slots[sl]=want.map(kk=>({k:kk,on:1})).concat(ins)}
  for(const id in L.t){if(TOK[id]){TOK[id].ref=null;TOK[id].v=L.t[id]}}
  push('تخطيط: '+L.g+' — '+L.l);apply();render();buildPanel();refreshCode()}

let HIST=[],HI=-1,SNAPS=[],REV=0,BASELINE=null,LOCKED={};
function push(label){
  const st=snapshotState();st._l=label;
  HIST=HIST.slice(0,HI+1);HIST.push(st);if(HIST.length>200)HIST.shift();HI=HIST.length-1;REV++;
  $('#revline').textContent='rev '+REV;save()}
function undo(){if(HI<=0)return toast('لا يوجد تراجع');HI--;restoreState(HIST[HI]);toast('تراجع: '+(HIST[HI]._l||''));save()}
function redo(){if(HI>=HIST.length-1)return toast('لا توجد إعادة');HI++;restoreState(HIST[HI]);toast('إعادة');save()}
let _sv;function save(){clearTimeout(_sv);_sv=setTimeout(()=>{
  try{localStorage.setItem('eight.studio.v1',JSON.stringify({s:snapshotState(),snaps:SNAPS,rev:REV,seq:PARTSEQ}))}catch(e){}},400)}
function load(){try{const j=JSON.parse(localStorage.getItem('eight.studio.v1'));if(!j)return false;
  SNAPS=j.snaps||[];REV=j.rev||0;PARTSEQ=j.seq||1;restoreState(j.s,true);return true}catch(e){return false}}
function snap(name){
  const n=name||prompt('اسم اللقطة؟','لقطة '+(SNAPS.length+1));if(!n)return;
  SNAPS.push({n:n,t:new Date().toLocaleString('ar-SA'),s:snapshotState()});save();buildPanel();toast('حُفظت اللقطة: '+n)}

const FONTBY={};FONTLIB.forEach(f=>FONTBY[f[0]]=f);
const UPFONTS=[];              /* خطوط رفعها المالك من جهازه */
const FONTSTATE={};            /* الاسم → 'load' | 'ok' | 'fail' | 'local' */
const FONTCATS=['هندسي','كوفي','نسخ','رقعة','رقيق','عريق','عرض','أحادي'];
const VARFONT=n=>/\.\./.test((FONTBY[n]||[])[4]||'');

function fontFallback(n){const f=FONTBY[n];if(f)return f[3];
  return (UPFONTS.find(u=>u.n===n)||{}).fb||'sans-serif'}
const fontValue=n=>n==='inherit'?'inherit':`"${n}",${fontFallback(n)}`;
function fontNameOf(v){if(!v||v==='inherit')return 'inherit';
  const m=String(v).match(/^\s*"([^"]+)"/);return m?m[1]:String(v).split(',')[0].trim()}

/* التحميل: نطلب الأوزان المسجّلة، وإن فشل الطلب نعيد المحاولة بالاسم وحده.
   بهذا لا يسقط خطّ أبدًا بسبب خطأ في جدول الأوزان. */
function loadFont(name,retry){
  if(!name||name==='inherit')return;
  if(UPFONTS.find(u=>u.n===name)){FONTSTATE[name]='local';return}
  if(FONTSTATE[name]&&!retry)return;
  const id='gf-'+name.replace(/\s+/g,'-')+(retry?'-r':'');
  if(document.getElementById(id))return;
  FONTSTATE[name]='load';
  const f=FONTBY[name],w=f?f[4]:'';
  const l=document.createElement('link');l.id=id;l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family='+name.replace(/ /g,'+')
        +(!retry&&w?':wght@'+w:'')+'&display=swap';
  l.onerror=()=>{if(!retry)loadFont(name,true);else{FONTSTATE[name]='fail';fontBadge()}};
  l.onload=()=>{FONTSTATE[name]='ok';
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{
      if(!document.fonts.check('16px "'+name+'"')){
        if(!retry)loadFont(name,true);else{FONTSTATE[name]='fail';fontBadge()}}
      else fontBadge()})};
  document.head.appendChild(l)}
function fontBadge(){const n=Object.keys(FONTSTATE).filter(k=>FONTSTATE[k]==='fail');
  const b=$('#fontwarn');if(!b)return;
  b.style.display=n.length?'inline-block':'none';
  b.textContent='تعذّر تحميل '+n.length+' خطّ';b.title=n.join(' · ')+'\nغالبًا لا اتصال بالإنترنت — الشكل يسقط لخطّ النظام.'}
function preloadUsedFonts(){ORDER.filter(id=>TOK[id].t==='font').forEach(id=>loadFont(fontNameOf(raw(id))))}

/* رفع خطّ من الجهاز → @font-face بترميز data */
function addUploadedFont(file){return new Promise(res=>{
  const r=new FileReader();
  r.onload=()=>{const nm=file.name.replace(/\.(woff2?|ttf|otf)$/i,'').replace(/[-_]/g,' ').trim();
    const st=document.createElement('style');
    st.textContent=`@font-face{font-family:"${nm}";src:url(${r.result});font-display:swap}`;
    document.head.appendChild(st);
    UPFONTS.push({n:nm,fb:'sans-serif',src:r.result});FONTSTATE[nm]='local';res(nm)};
  r.readAsDataURL(file)})}

const SAMPLE_AR='خذ دورك الآن · تكية · ٤٫٦ · ٢٠ دقيقة';
const SAMPLE_LA='EIGHT · Take your turn · 4.6 · 20 min';
let FMENU=null;
function closeFontMenu(){if(FMENU){FMENU.remove();FMENU=null;document.removeEventListener('mousedown',_fmOut,true)}}
function _fmOut(e){if(FMENU&&!FMENU.contains(e.target))closeFontMenu()}
function openFontMenu(anchor,current,pick,allowInherit){
  closeFontMenu();
  const m=el('div','fmenu');FMENU=m;
  const q=el('input','txt');q.placeholder='ابحث باسم الخطّ…';q.style.width='100%';
  const rowf=el('div','pillrow');
  let scr='all',cat='all';
  const list=el('div','flist');
  const mk=(txt,on,fn)=>{const b=el('button','pill'+(on?' on':''),txt);b.onclick=fn;return b};
  function chips(){rowf.innerHTML='';
    [['all','الكل'],['ar','عربي'],['la','لاتيني'],['up','مرفوع']].forEach(([k,l])=>
      rowf.appendChild(mk(l,scr===k,()=>{scr=k;chips();draw()})));
    rowf.appendChild(el('span','sep'));
    rowf.appendChild(mk('كل التصنيفات',cat==='all',()=>{cat='all';chips();draw()}));
    FONTCATS.forEach(c=>rowf.appendChild(mk(c,cat===c,()=>{cat=c;chips();draw()})))}
  function draw(){
    list.innerHTML='';
    const term=q.value.trim().toLowerCase();
    if(allowInherit&&!term){
      const r=el('div','frow'+(current==='inherit'?' on':''),
        `<div class="fn">موروث — نفس خطّ الواجهة</div><div class="fnote">لا يفرض خطًّا خاصًّا؛ يتبع «خط الواجهة» العام.</div>`);
      r.onclick=()=>{pick('inherit');closeFontMenu()};list.appendChild(r)}
    const up=UPFONTS.map(u=>[u.n,'ar','مرفوع',u.fb,'','خطّ رفعته من جهازك.']);
    const all=(scr==='up'?up:up.concat(FONTLIB));
    all.filter(f=>(scr==='all'||scr==='up'||f[1]===scr)&&(cat==='all'||f[2]===cat)
                 &&(!term||f[0].toLowerCase().includes(term)))
      .forEach(f=>{
        const r=el('div','frow'+(f[0]===current?' on':''));
        r.innerHTML=`<div class="fn" style="font-family:'${f[0]}',${f[3]}">${f[0]}</div>
          <div class="ftag">${f[2]}${VARFONT(f[0])?' · متغيّر':''}${f[1]==='ar'?'':' · لاتيني فقط'}</div>
          <div class="fsample" style="font-family:'${f[0]}',${f[3]}">${f[1]==='la'?SAMPLE_LA:SAMPLE_AR}</div>
          <div class="fnote">${f[5]||''}</div>`;
        r.onmouseenter=()=>loadFont(f[0]);
        r.onclick=()=>{loadFont(f[0]);pick(f[0]);closeFontMenu()};
        list.appendChild(r);
        /* حمّل ما يظهر فعلًا فقط */
        if(list.children.length<14)loadFont(f[0])})}
  q.oninput=draw;
  const foot=el('div','fmfoot');
  const fi=el('input');fi.type='file';fi.accept='.woff2,.woff,.ttf,.otf';fi.style.width='100%';
  fi.onchange=async e=>{const f=e.target.files[0];if(!f)return;
    const nm=await addUploadedFont(f);pick(nm);closeFontMenu();toast('أُضيف «'+nm+'» إلى المكتبة')};
  foot.append(el('div','mini','أو ارفع ملف خطّ من جهازك (woff2 / ttf / otf) — يدخل المكتبة ويُصدَّر مضمَّنًا.'),fi);
  m.append(q,rowf,list,foot);
  document.body.appendChild(m);
  const b=anchor.getBoundingClientRect();
  m.style.top=Math.min(b.bottom+4,innerHeight-460)+'px';
  /* موضع بالإحداثي الأفقي المطلق لا المنطقي — في RTL يعكس insetInlineStart الجهة */
  m.style.left=Math.max(8,Math.min(b.left,innerWidth-(m.offsetWidth||390)-8))+'px';
  chips();draw();q.focus();
  setTimeout(()=>document.addEventListener('mousedown',_fmOut,true),0)}

const KLABEL={var:'متغيّر CSS',rule:'قاعدة CSS',util:'أداة Tailwind داخل TSX',lock:'مقفل — لا يُغيَّر'};
function destOf(id){
  if(DEST[id])return DEST[id];
  const g=TOK[id]&&TOK[id].g;
  if(g&&DESTG[g])return DESTG[g];
  if(g&&g.startsWith('tex:'))return{k:'rule',f:G,t:'.rq-card / body',n:'الخامات طبقات خلفية — تُضاف كقاعدة جديدة.'};
  return null}
function destLine(id){
  const d=destOf(id);
  if(!d)return '<span class="dnone">في المشروع: لا وجهة معروفة بعد — قل لي وأحدّدها.</span>';
  const where=[d.f,d.t?'<code>'+d.t+'</code>':'',d.p?'<code>'+d.p+'</code>':''].filter(Boolean).join(' → ');
  return `<span class="dest d-${d.k}">في المشروع: <b>${KLABEL[d.k]}</b> · ${where}${d.n?' — '+d.n:''}</span>`}
/* ══════════════════════════════════════════════════════════════

const GLOBALS_SRC="@import \"tailwindcss\";\n\n@custom-variant dark (&:where(.dark, .dark *));\n\n@theme {\n  /* \u2550\u2550\u2550\u2550 \u0647\u0648\u064a\u0629 \u0625\u064a\u062a / EIGHT \u2014 \u0631\u0642\u0645 \u0644\u0648\u0646 \u0648\u0627\u062d\u062f \u2550\u2550\u2550\u2550\n     #781e0c \u0648\u062d\u062f\u0647. \u0644\u0627 \u062f\u0631\u062c\u0629 \u062b\u0627\u0646\u064a\u0629 \u0645\u0633\u062a\u0642\u0644\u0651\u0629 \u0623\u0628\u062f\u064b\u0627: \u0643\u0644 \u00ab\u062a\u0641\u062a\u064a\u062d\u00bb \u0634\u0641\u0627\u0641\u064a\u0629\u064c \u0645\u0646 \u0627\u0644\u0631\u0642\u0645\n     \u0646\u0641\u0633\u0647 (.72 / .46 / .24 / .10 / .05). \u0627\u0644\u0633\u0644\u0651\u0645 \u0623\u062f\u0646\u0627\u0647 \u0623\u064f\u0628\u0642\u064a \u0628\u0623\u0633\u0645\u0627\u0626\u0647 \u0644\u062a\u0648\u0627\u0641\u0642\n     \u0627\u0644\u0635\u0641\u0648\u0641 \u0627\u0644\u0642\u0627\u0626\u0645\u0629\u060c \u0644\u0643\u0646 \u0642\u064a\u0645\u0647 \u0635\u0627\u0631\u062a \u0634\u0641\u0627\u0641\u064a\u0627\u062a \u0644\u0627 \u0623\u0644\u0648\u0627\u0646\u064b\u0627 \u0645\u0633\u062a\u0642\u0644\u0651\u0629. */\n  --color-brand-50: rgba(120, 30, 12, 0.05);\n  --color-brand-100: rgba(120, 30, 12, 0.10);\n  --color-brand-200: rgba(120, 30, 12, 0.24);\n  --color-brand-300: rgba(120, 30, 12, 0.46);\n  --color-brand-400: rgba(120, 30, 12, 0.72);\n  --color-brand-500: #781e0c;\n  --color-brand-600: #781e0c;\n  --color-brand-700: #781e0c;\n  --color-brand-800: #781e0c;\n  --color-brand-900: #781e0c;\n\n  /* \u0643\u0631\u064a\u0645\u064a \u0627\u0644\u0647\u0648\u064a\u0629 \u2014 \u0628\u062f\u064a\u0644 \u0627\u0644\u0623\u0628\u064a\u0636 \u0627\u0644\u0635\u0631\u064a\u062d \u0641\u0648\u0642 \u0627\u0644\u0639\u0646\u0627\u0628\u064a (\u0627\u0644\u0623\u0628\u064a\u0636 \u064a\u0642\u0633\u0651\u064a \u0648\u064a\u0628\u0631\u062f \u0627\u0644\u0644\u0648\u0646) */\n  --color-cream-100: #f6efe2;\n  --color-cream-200: #efe7da;\n  --color-cream-300: #e4dacb;\n  /* \u062a\u0648\u0627\u0641\u0642 \u0642\u062f\u064a\u0645: \u0623\u064a \u0625\u0634\u0627\u0631\u0629 \u0630\u0647\u0628\u064a\u0629 \u0633\u0627\u0628\u0642\u0629 \u062a\u0635\u064a\u0631 \u0631\u0642\u0645 \u0627\u0644\u0647\u0648\u064a\u0629 \u0646\u0641\u0633\u0647 */\n  --color-gold-400: #781e0c;\n  --color-gold-500: #781e0c;\n\n  /* \u0627\u0644\u0643\u062d\u0644\u064a \u0623\u064f\u0644\u063a\u064a \u2014 \u062d\u0628\u0631 \u062f\u0627\u0641\u0626 \u0648\u0627\u062d\u062f \u064a\u062e\u062f\u0645 \u0627\u0644\u0646\u0635\u0648\u0635 \u0643\u0644\u0647\u0627 */\n  --color-navy-700: #2e1d14;\n  --color-navy-800: #2e1d14;\n  --color-navy-900: #2e1d14;\n\n  /* \u0639\u0631\u0628\u064a: IBM Plex Sans Arabic \u2014 \u0623\u0647\u062f\u0623 \u0648\u0623\u0648\u0636\u062d \u0639\u0644\u0649 \u0627\u0644\u062c\u0648\u0627\u0644 \u0645\u0646 \u0627\u0644\u0645\u0633\u064a\u0631\u064a\u060c \u0648\u0648\u0632\u0646\u0647\n     \u0627\u0644\u062b\u0642\u064a\u0644 \u064a\u0643\u0641\u064a \u0644\u0644\u0639\u0646\u0627\u0648\u064a\u0646 \u0641\u0644\u0627 \u0646\u062d\u062a\u0627\u062c \u062e\u0637\u064b\u0651\u0627 \u062b\u0627\u0646\u064a\u064b\u0627. \u0627\u0644\u0639\u0646\u0627\u0648\u064a\u0646 \u0627\u0644\u0644\u0627\u062a\u064a\u0646\u064a\u0629\n     \u0648\u0627\u0644\u0623\u062d\u0631\u0641 \u0627\u0644\u0623\u0648\u0644\u0649: DM Serif Display. \u0627\u0644\u0634\u0639\u0627\u0631 \u0644\u0627 \u064a\u0633\u062a\u0639\u0645\u0644 \u0623\u064a \u062e\u0637 \u2014 \u062d\u0631\u0648\u0641\u0647\n     \u0645\u0633\u0627\u0631\u0627\u062a \u0645\u062a\u062c\u0647\u0629 (src/components/logo.tsx). */\n  --font-sans: var(--font-plex-ar), \"IBM Plex Sans Arabic\", system-ui, sans-serif;\n  --font-display: var(--font-plex-ar), \"IBM Plex Sans Arabic\", system-ui, sans-serif;\n  --font-serif: var(--font-dm-serif), \"DM Serif Display\", Georgia, serif;\n\n  --radius-card: 26px;\n  --radius-btn: 18px;\n}\n\n:root {\n  --background: #ede7dc;\n  --foreground: #2e1d14;\n  --surface: #fcfaf6;\n  --surface-2: #efe7da;\n  --sand: #e4dacb;\n  --sage: rgba(120, 30, 12, 0.05);\n  --muted: #8b7a6b;\n  --muted-2: #a89685;\n  --border: #e4dacb;\n  --hairline: #efe7da;\n  /* \u2550\u2550\u2550\u2550 \u0631\u0642\u0645 \u0627\u0644\u0647\u0648\u064a\u0629 \u0627\u0644\u0648\u0627\u062d\u062f \u2550\u2550\u2550\u2550\n     \u0643\u0644 \u062e\u0644\u0641\u064a\u0629 \u0645\u0644\u0648\u0651\u0646\u0629 \u0628\u0627\u0644\u062a\u0637\u0628\u064a\u0642 (\u0647\u064a\u062f\u0631\u060c \u0623\u0632\u0631\u0627\u0631\u060c \u0634\u0627\u0631\u0627\u062a\u060c \u0628\u0646\u0631\u0627\u062a \u2014 \u0639\u0645\u064a\u0644 \u0648\u0645\u0627\u0644\u0643\n     \u0648\u0627\u0633\u062a\u0642\u0628\u0627\u0644) \u062a\u0642\u0631\u0623 \u0645\u0646 \u0647\u0630\u0627 \u0627\u0644\u0633\u0637\u0631 \u0648\u062d\u062f\u0647. \u062a\u063a\u064a\u064a\u0631 \u0647\u0648\u064a\u0629 \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u0643\u0644\u0651\u0647 = \u062a\u0639\u062f\u064a\u0644\n     \u0647\u0630\u0627 \u0627\u0644\u0631\u0642\u0645 \u0641\u0642\u0637. \u0645\u0645\u0646\u0648\u0639 \u0623\u064a \u062a\u062f\u0631\u0651\u062c \u0644\u0648\u0646\u064a \u0623\u0648 \u062f\u0631\u062c\u0629 \u062b\u0627\u0646\u064a\u0629 \u0641\u064a \u0639\u0646\u0627\u0635\u0631 \u0627\u0644\u0647\u0648\u064a\u0629. */\n  --brand-solid: #781e0c;\n  /* \u0631\u0645\u0648\u0632 \u0627\u0644\u0634\u0639\u0627\u0631 \u2014 \u0645\u0646 LOGO-SPEC.md\u060c \u0644\u0627 \u062a\u064f\u0639\u062f\u064e\u0651\u0644 */\n  --brand-maroon: #781e0c;   /* \u0644\u0648\u0646 \u0627\u0644\u0639\u0644\u0627\u0645\u0629 \u2014 \u0644\u0648\u0646 \u0648\u0627\u062d\u062f\u060c \u0644\u0627 \u062f\u0631\u062c\u0629 \u062b\u0627\u0646\u064a\u0629 */\n  --brand-cream-1: #f7f0e4;  /* \u0623\u0639\u0644\u0649 \u062a\u062f\u0631\u0651\u062c \u0627\u0644\u0645\u0631\u0628\u0651\u0639 */\n  --brand-cream-2: #e4d7c2;  /* \u0623\u0633\u0641\u0644 \u062a\u062f\u0631\u0651\u062         const a=[].slice.call(arguments),g=a.slice(1,a.length-2);

function stressScan(){
  const found=[];const seen=new Set();
  SCREENS.forEach(([sk,slab])=>{
    gotoScreen(sk);
    const app=$('#app');if(!app)return;
    const box=app.getBoundingClientRect();

    if(app.scrollWidth>app.clientWidth+1)
      found.push({t:'الشاشة كلّها تفيض أفقيًّا بمقدار '+Math.round(app.scrollWidth-app.clientWidth)+'px',sc:sk,sel:null,sev:2});
    /* حاويات التمرير: الفيض الحقيقي هو ما يجبر المستخدم على السحب جانبًا،
       لا ما يقصّه إطار الجوّال (كالرقم الشبح، وهو مقصود). */
    $$('#app .scroll, #app .bwrap, #app .gal, #app .chips').forEach(sc=>{
      if(sc.scrollWidth>sc.clientWidth+2&&!/bwrap|gal|chips/.test(sc.className)){
        const nm=sc.dataset.el||'scroll';
        found.push({t:'«'+nm+'» يُجبر على السحب جانبًا ('+Math.round(sc.scrollWidth-sc.clientWidth)+'px زائدة)',sc:sk,sel:nm,sev:2})}});
    $$('#app *').forEach(n=>{
      const r=n.getBoundingClientRect();
      if(r.width<1||r.height<1)return;
      const nm=n.dataset.el||n.tagName.toLowerCase();
      const key=sk+':'+nm;

         الشعارات والأرقام الشبحية تُخفي فائضها عمدًا ولا تُعدّ عيبًا. */
      const hasText=[...n.childNodes].some(x=>x.nodeType===3&&x.textContent.trim());
      if(hasText&&c.textOverflow==='ellipsis'&&c.whiteSpace==='nowrap'&&n.scrollWidth>n.clientWidth+2){
        if(!seen.has(key+':cut')){seen.add(key+':cut');

    })});

function drawOverlays(){

      const d=el('div','pd');d.style.position='absolute';d.style.background='rgba(140,220,120,.22)';d.style.zIndex=39;

      if(side==='Left')d.style.cssText+=`left:${r.left-f.left}px;top:${r.top-f.top}px;width:${v}px;height:${r.height}px`;
      if(side==='Right')d.style.cssText+=`left:${r.right-f.left-v}px;top:${r.top-f.top}px;width:${v}px;height:${r.height}px`;

function identOf(node,name){

  const bg=toks.find(t=>/^s\.(bg|surface|surface\.pressed|header\.bg|header2\.bg|nav\.bg|ticket\.bg|chip\.bg|brand)$/.test(t));
  const ink=toks.find(t=>/^s\.(ink3|ink2|ink|brand\.text|brand\.ink|state\.|gold)/.test(t));
  const font=toks.find(t=>/\.font$/.test(t));

    while(q&&!tex){q=q.parentElement&&q.parentElement.closest('[data-el]');if(q)tex=TEXFOR[elName(q)]}}

let DRAG=null;
$('#app').addEventListener('mousedown',e=>{
  if(!EDIT)return;dragStart(e.target,e.clientX,e.clientY,e)});
/* ══════════════════════════════════════════════════════════════
   السحب — بالإصبع كما بالماوس، وبلا وضع منفصل: في التحرير يكفي أن
   تمسك العنصر وتسحبه. وكل حركة تُكتب توكنًا فتظهر في الكود.
   ══════════════════════════════════════════════════════════════ */
function dragStart(target,cx,cy,ev){
  let n=target.closest&&target.closest('[data-el]');if(!n)return;
  if(n.dataset.auto){const named=n.closest('[data-el]:not([data-auto])');if(named)n=named}
  if(n.dataset.lock==='1')return;
  const k=elName(n);ensureFM(k);
  DRAG={k:k,x0:cx,y0:cy,ox:+raw('c.fm.'+k+'.x'),oy:+raw('c.fm.'+k+'.y'),node:n,moved:false};
  if(ev&&ev.preventDefault)ev.preventDefault();selectEl(n)}
function dragMove(cx,cy,mods){
  if(!DRAG)return false;
  const snapg=(mods&&mods.alt)?1:((mods&&mods.shift)?8:4);
  let dx=cx-DRAG.x0,dy=cy-DRAG.y0;
  if(!DRAG.moved&&Math.abs(dx)<4&&Math.abs(dy)<4)return false;   /* لمسة لا سحبة */
  DRAG.moved=true;
  dx=Math.round(dx/snapg)*snapg;dy=Math.round(dy/snapg)*snapg;
  const X=round(DRAG.ox-dx,1),Y=round(DRAG.oy+dy,1);   /* RTL: يمين موجب */
  TOK['c.fm.'+DRAG.k+'.x'].v=X;
  TOK['c.fm.'+DRAG.k+'.y'].v=Y;
  /* لا نعيد رسم الشاشة أثناء السحب: إعادة الرسم تنتزع العنصر من تحت
     الإصبع فينقطع تتبّع اللمس بعد أول خطوة. نزيحه مباشرة، ونعيد الرسم
     مرّةً واحدة عند الإفلات. وهذا أخفّ وأنعم كذلك. */
  const n=DRAG.node;
  if(n&&n.isConnected){
    n.style.position='relative';n.style.insetInlineStart=X+'px';n.style.top=Y+'px';
    showSnapLines(n);showMeasure(n,DRAG.k)}
  return true}
function dragEnd(){
  if(!DRAG)return;
  const k=DRAG.k,moved=DRAG.moved;
  DRAG=null;
  if(moved){push('سحب: '+k);apply();render();refreshCode();buildPanel();
    setTimeout(()=>{const node=$$('#app [data-el]').find(x=>elName(x)===k);
      if(node)openPop(node)},30)}
  $$('.snapline,.measbadge',$('#ovl')).forEach(n=>n.remove())}
/* شارة القياس الحيّ */
function showMeasure(node,k){
  $$('.measbadge',$('#ovl')).forEach(n=>n.remove());
  const f=$('#frame').getBoundingClientRect(),r=node.getBoundingClientRect();
  const b=el('div','measbadge');
  b.innerHTML=`<b>${round(+raw('c.fm.'+k+'.x'),1)}</b> س · <b>${round(+raw('c.fm.'+k+'.y'),1)}</b> ص`
    +` · ${Math.round(r.width)}×${Math.round(r.height)}`;
  b.style.cssText=`left:${clamp(r.left-f.left,2,f.width-120)}px;top:${clamp(r.top-f.top-20,2,f.height-20)}px`;
  $('#ovl').appendChild(b)}
document.addEventListener('mousemove',e=>{dragMove(e.clientX,e.clientY,{alt:e.altKey,shift:e.shiftKey})});
document.addEventListener('mouseup',dragEnd);
$('#app').addEventListener('touchstart',e=>{
  if(!EDIT||e.touches.length!==1)return;
  const t=e.touches[0];dragStart(t.target,t.clientX,t.clientY,null)},{passive:true});
/* المتابعة على المستند لا على العنصر: كل حركة تعيد رسم الشاشة فينفصل
   العنصر الملموس عن الصفحة، ولمس منفصل لا تصعد أحداثه — فكانت السحبة
   تتوقّف بعد أول خطوة ولا يصل touchend أصلًا. */
document.addEventListener('touchmove',e=>{
  if(!DRAG||e.touches.length!==1)return;
  const t=e.touches[0];

document.addEventListener('touchend',dragEnd);

function showSnapLines(node){
  $$('.snapline',$('#ovl')).forEach(n=>n.remove());
  const f=$('#frame').getBoundingClientRect(),r=node.getBoundingClientRect();
  const others=$$('#app [data-el]').filter(n=>n!==node);
  const edges=[['left',r.left],['right',r.right],['top',r.top],['bottom',r.bottom],
    ['cx',(r.left+r.right)/2],['cy',(r.top+r.bottom)/2]];
  others.forEach(o=>{const q=o.getBoundingClientRect();
    [[r.left,q.left,'v'],[r.right,q.right,'v'],[(r.left+r.right)/2,(q.left+q.right)/2,'v'],
     [r.top,q.top,'h'],[r.bottom,q.bottom,'h'],[(r.top+r.bottom)/2,(q.top+q.bottom)/2,'h']].forEach(([a,b,ax])=>{
      if(Math.abs(a-b)>1.2)return;const d=el('div','snapline');
      if(ax==='v')d.style.cssText=`left:${a-f.left}px;top:0;width:1px;height:100%`;
      else d.style.cssText=`top:${a-f.top}px;left:0;height:1px;width:100%`;
      $('#ovl').appendChild(d)})})}

      const i=STRUCT.slots[sl].findIndex(p=>p.k==='ins:'+(k.split('.')[1]||''));if(i>=0)return dupPart(sl,i)}}
    return toast('التكرار متاح للأجزاء المُدرَجة')}
  if(typing)return;
  if(e.key==='Escape'){selectEl(null);MPICK=[];drawSel();return}
  if(e.key.toLowerCase()==='e')return $('#bEdit').click();
  if(e.key.toLowerCase()==='p')return $('#bPure').click();
  if(e.key.toLowerCase()==='c')return $('#bAB').click();
  if(e.key.toLowerCase()==='s')return snap();
  if(e.key.toLowerCase()==='x')return $('#bExport').click();
  if(e.key.toLowerCase()==='g'){OVL.grid8=!OVL.grid8;drawOverlays();return}
  if(/^[1-9]$/.test(e.key)&&SCREENS[+e.key-1])return closePop(),gotoScreen(SCREENS[+e.key-1][0]);
  if(e.key.startsWith('Arrow')&&SEL.length){
    const step=e.shiftKey?10:1;const k=elName(SEL[0]);ensureFM(k);
    const ax=e.key==='ArrowLeft'||e.key==='ArrowRight'?'x':'y';
    const dir=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1;
    TOK['c.fm.'+k+'.'+ax].v=round(+raw('c.fm.'+k+'.'+ax)+dir*step,1);
    e.preventDefault();render();refreshCode()}});

/* ══════════════════════════════════════════════════════════════
   ١٧) الإقلاع
   ══════════════════════════════════════════════════════════════ */
let BASELINE_CONTENT=null;
function boot(){
  ROOTS=[$('#app')];
  apply();render();
  BASELINE=snapshotState();BASELINE._l='خط الأساس';
  BASELINE_CONTENT=snapshotState();
  HIST=[BASELINE];HI=0;
  const restored=load();
  if(restored){apply();render()}
  buildTabs();buildPanel();buildInspector();buildScreens();refreshCode();
  layoutStage();drawOverlays();
  const ro=new ResizeObserver(()=>{drawSel();});ro.observe($('#app'));
  setInterval(()=>{if(SEL.length)drawSel()},600);
  if(!restored)toast('خط الأساس محمّل · اضغط E للتحرير');
  else toast('استُعيد عملك المحفوظ · rev '+REV);
}
boot();
</script>
