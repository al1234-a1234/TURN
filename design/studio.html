<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورشة إيت — EIGHT DESIGN STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf-base" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Alexandria:wght@100;300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Literata:opsz,wght@7..72,200..900&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   STUDIO UI — واجهة الورشة. داكنة محايدة عمدًا: لا تشبه التطبيق
   ولا تخدع العين عن ألوانه. لا تستعمل أي توكن من توكنات التطبيق.
   ══════════════════════════════════════════════════════════════ */
:root{
  --u-bg:#0e0e10; --u-bg2:#151518; --u-bg3:#1c1c20; --u-line:#2a2a30;
  --u-ink:#e7e7ea; --u-dim:#8d8d97; --u-dim2:#6a6a73; --u-acc:#6f9dd6; --u-warn:#d8a657; --u-bad:#d16b6b; --u-good:#6fbf8b;
  --u-r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--u-bg);color:var(--u-ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:12.5px;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1.5px solid var(--u-acc);outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#33333b;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── الشريط العلوي ── */
#top{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;background:var(--u-bg2);
  border-bottom:1px solid var(--u-line);flex:none;overflow-x:auto}
#top .logo{font-weight:700;font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
#top .rev{font-size:10.5px;color:var(--u-dim2);font-family:ui-monospace,monospace;direction:ltr}
.tbtn{border:1px solid var(--u-line);border-radius:var(--u-r);padding:5px 9px;font-size:11.5px;color:var(--u-dim);white-space:nowrap}
.tbtn:hover{color:var(--u-ink);border-color:#3c3c45}
.tbtn.on{background:#26262c;color:var(--u-ink);border-color:#43434f}
.sep{width:1px;height:20px;background:var(--u-line);flex:none}
.grow{flex:1}

/* ── التخطيط ── */
#main{display:flex;height:calc(100% - 44px);align-items:stretch}
#insp{width:326px;flex:none;display:flex;flex-direction:column;background:var(--u-bg2);border-inline-end:1px solid var(--u-line);min-width:0}
#stagewrap{flex:1;min-width:0;position:relative;overflow:auto;background:
  linear-gradient(0deg,rgba(255,255,255,.014) 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px) 0 0/22px 22px, #0b0b0d}
#ctrl{width:352px;flex:none;display:flex;background:var(--u-bg2);border-inline-start:1px solid var(--u-line);min-width:0}
.rsz{width:5px;cursor:col-resize;background:transparent;flex:none}
.rsz:hover{background:#2f2f38}
.collapsed{display:none!important}

/* ── لوحة التحكم ── */
#ctabs{width:96px;flex:none;border-inline-start:1px solid var(--u-line);overflow-y:auto;padding:6px 0;background:#101013}
#ctabs button{display:block;width:100%;text-align:start;padding:8px 10px;font-size:11.5px;color:var(--u-dim);border-inline-start:2px solid transparent}
#ctabs button.on{color:var(--u-ink);background:#1e1e24;border-inline-start-color:var(--u-acc)}
#cbody{flex:1;overflow-y:auto;padding:10px 12px 60px;min-width:0}

/* ── عناصر اللوحات ── */
.sec{border:1px solid var(--u-line);border-radius:10px;margin-bottom:9px;overflow:hidden;background:var(--u-bg3)}
.sec>h4{margin:0;padding:8px 10px;font-size:11.5px;font-weight:600;color:var(--u-ink);background:#202027;
  display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.sec>h4 .cnt{margin-inline-start:auto;font-size:10px;color:var(--u-dim2);font-family:ui-monospace,monospace}
.sec>.body{padding:8px 10px}
.sec.closed>.body{display:none}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:4px 0;min-height:28px}
.row>label{font-size:11.5px;color:var(--u-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.row>label b{color:var(--u-ink);font-weight:500}
.ctl{display:flex;align-items:center;gap:5px}
/* input.num لا .num المجرّدة: المعاينة نفسها تستعمل .num لرقم التذكرة (div)،
   والقاعدة المجرّدة كانت تتسرّب إليه فتصبغه بخلفية الورشة الداكنة. */
input.num{width:62px;background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:3px 5px;font-size:11px;
  font-family:ui-monospace,monospace;direction:ltr;text-align:center}
.txt{width:100%;background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:5px 7px;font-size:11.5px}
.uni{background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:3px;font-size:10.5px}
input[type=range]{width:118px;accent-color:var(--u-acc);background:transparent}
input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--u-line);border-radius:5px;background:#0f0f12;cursor:pointer}
.hex{width:78px;background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:3px 5px;font-size:10.5px;
  font-family:ui-monospace,monospace;direction:ltr;text-align:center}
.sel{background:#0f0f12;border:1px solid var(--u-line);border-radius:6px;padding:3px 5px;font-size:11px;max-width:150px}
.chk{width:15px;height:15px;accent-color:var(--u-acc)}
.mini{font-size:10px;color:var(--u-dim2);line-height:1.7}
.mini code{font-family:ui-monospace,monospace;color:#a9b7c9;direction:ltr}
.hint{font-size:10.5px;color:var(--u-dim2);line-height:1.75;padding:4px 0 6px}
.pillrow{display:flex;flex-wrap:wrap;gap:5px;padding:3px 0}
.pill{border:1px solid var(--u-line);border-radius:99px;padding:4px 9px;font-size:10.5px;color:var(--u-dim)}
.pill:hover{color:var(--u-ink);border-color:#454550}
.pill.on{background:#2b2b33;color:#fff;border-color:#50505d}
.warnbox{border:1px solid #4a3a22;background:#241d12;border-radius:8px;padding:7px 9px;font-size:11px;color:#e2c68d;line-height:1.8;margin-bottom:6px}
.badbox{border:1px solid #4a2626;background:#241414;border-radius:8px;padding:7px 9px;font-size:11px;color:#e6a1a1;line-height:1.8;margin-bottom:6px}
.goodbox{border:1px solid #24422f;background:#12211a;border-radius:8px;padding:7px 9px;font-size:11px;color:#9ad4b1;line-height:1.8}
.exc{color:var(--u-warn);font-size:9.5px;margin-inline-start:4px}
.lnk{color:var(--u-acc);font-size:10.5px;text-decoration:underline;cursor:pointer;background:none;border:0}

/* ── المفتش ── */
#insp .hd{padding:8px 11px;border-bottom:1px solid var(--u-line);display:flex;align-items:center;gap:7px;flex:none}
#insp .hd b{font-size:11.5px}
#ibody{overflow-y:auto;padding:9px 11px;flex:1;min-height:120px}
#codewrap{border-top:1px solid var(--u-line);display:flex;flex-direction:column;height:44%;flex:none;min-height:0}
#codetabs{display:flex;gap:2px;padding:5px 7px;border-bottom:1px solid var(--u-line);overflow-x:auto;flex:none;background:#101013}
#codetabs button{padding:4px 7px;border-radius:6px;font-size:10.5px;color:var(--u-dim);white-space:nowrap}
#codetabs button.on{background:#26262c;color:#fff}
#code{flex:1;overflow:auto;margin:0;padding:9px 11px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:10.5px;
  line-height:1.75;color:#c8cfd8;white-space:pre;direction:ltr;text-align:left;background:#0b0b0d}
#codebar{display:flex;gap:5px;padding:6px 7px;border-top:1px solid var(--u-line);flex:none;align-items:center;flex-wrap:wrap}

/* ── شجرة العناصر ── */
.tree{font-size:11px;line-height:1.5}
.tree .tr{display:flex;align-items:center;gap:4px;padding:2.5px 3px;border-radius:5px;cursor:pointer}
.tree .tr:hover{background:#232329}
.tree .tr.on{background:#2e3a48;color:#fff}
.tree .tr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-family:ui-monospace,monospace;font-size:10px}
.tree .tr .ic{width:16px;text-align:center;font-size:10px;color:var(--u-dim2);flex:none}
.tree .tr .ic:hover{color:#fff}

/* ── المسرح ── */
#stage{padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100%;
  transform-origin:top center}
.frame{width:390px;height:844px;border-radius:38px;overflow:hidden;position:relative;background:#000;
  border:1px solid #3a3a42;box-shadow:0 30px 70px -38px rgba(0,0,0,.95);flex:none}
.frame.se{width:375px;height:667px}
.frame.px{width:412px;height:915px}
.frame.tb{width:744px;height:1024px}
.fcap{font-size:10.5px;color:var(--u-dim2);text-align:center}
#sheet{display:none;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
#sheet.on{display:flex}
#sheet .cell{display:flex;flex-direction:column;gap:6px;align-items:center}
#sheet .frame{transform-origin:top center}
#abwrap{display:none;gap:16px;align-items:flex-start}
#abwrap.on{display:flex}
#single.off{display:none}
.splitwrap{position:relative}
.splitwrap .over{position:absolute;inset:0;overflow:hidden;border-radius:38px;pointer-events:none}
.splitwrap .handle{position:absolute;top:0;bottom:0;width:2px;background:var(--u-acc);cursor:ew-resize;z-index:9}
.splitwrap .handle:after{content:"";position:absolute;top:50%;inset-inline-start:-11px;width:24px;height:24px;border-radius:50%;
  background:var(--u-acc);transform:translateY(-50%)}

/* ── طبقات القياس فوق المعاينة ── */
.ovl{position:absolute;inset:0;pointer-events:none;z-index:40}
.ovl.grid8{background:
  linear-gradient(0deg,rgba(0,120,255,.16) 1px,transparent 1px) 0 0/100% 8px,
  linear-gradient(90deg,rgba(0,120,255,.16) 1px,transparent 1px) 0 0/8px 100%}
.ovl.cols{background:repeating-linear-gradient(90deg,rgba(255,0,90,.10) 0 calc((100% - 5*20px)/6),transparent 0 calc((100% - 5*20px)/6 + 20px))}
.ovl.base{background:repeating-linear-gradient(0deg,transparent 0 19px,rgba(0,255,180,.22) 19px 20px)}
.ovl.safe:before,.ovl.safe:after{content:"";position:absolute;inset-inline:0;background:rgba(255,180,0,.13)}
.ovl.safe:before{top:0;height:47px}.ovl.safe:after{bottom:0;height:34px}
.hoverbox{position:absolute;border:1px solid #4d9cff;background:rgba(77,156,255,.08);pointer-events:none;z-index:41;border-radius:3px}
.selbox{position:absolute;border:1.5px solid #ffb020;pointer-events:none;z-index:42;border-radius:3px;box-shadow:0 0 0 9999px rgba(0,0,0,.0)}
.elbadge{position:absolute;z-index:43;background:#ffb020;color:#241a00;font-size:9px;font-family:ui-monospace,monospace;
  padding:1px 4px;border-radius:3px;pointer-events:none;white-space:nowrap;direction:ltr}
.boxmodel .pd{position:absolute;background:rgba(140,220,120,.22);pointer-events:none;z-index:39}
.rulerline{position:absolute;background:#ff5aa7;z-index:44;pointer-events:none}
.rulertag{position:absolute;z-index:45;background:#ff5aa7;color:#2a0014;font-size:9px;padding:1px 4px;border-radius:3px;
  font-family:ui-monospace,monospace;pointer-events:none}
.touchbad{position:absolute;outline:1.5px dashed #ff5a5a;z-index:41;pointer-events:none;border-radius:4px}
#stage.gs .frame{filter:grayscale(1)}
#stage.cb-p .frame{filter:url(#cbP)}
#stage.cb-d .frame{filter:url(#cbD)}
#stage.cb-t .frame{filter:url(#cbT)}

/* ── حالة السحب ── */
.dragging{opacity:.4}
.dropline{position:absolute;background:var(--u-acc);z-index:46;pointer-events:none;border-radius:2px}
.snapline{position:absolute;background:#ff5aa7;z-index:46;pointer-events:none}
body.editing .app *{cursor:crosshair}
body.freemove .app [data-el].fmsel{cursor:move}

/* ── لوحة الأوامر ── */
#cmdk{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;padding-top:12vh;justify-content:center}
#cmdk.on{display:flex}
#cmdk .box{width:min(620px,92vw);height:min(440px,70vh);background:var(--u-bg2);border:1px solid var(--u-line);
  border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#cmdk input{border:0;border-bottom:1px solid var(--u-line);background:transparent;padding:12px 14px;font-size:14px;outline:0}
#cmdk .list{overflow-y:auto;padding:5px}
#cmdk .it{padding:7px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;display:flex;gap:8px;align-items:center}
#cmdk .it:hover,#cmdk .it.on{background:#2a2a33}
#cmdk .it .id{font-family:ui-monospace,monospace;font-size:10px;color:var(--u-dim2);direction:ltr;margin-inline-start:auto}

/* ── توست الورشة ── */
#utoast{position:fixed;bottom:16px;inset-inline-start:50%;transform:translateX(50%) translateY(10px);background:#26262e;
  border:1px solid var(--u-line);color:#fff;padding:8px 14px;border-radius:9px;font-size:11.5px;z-index:300;opacity:0;
  transition:.2s;pointer-events:none}
#utoast.on{opacity:1;transform:translateX(50%)}

/* ══════════════════════════════════════════════════════════════
   APP — التطبيق. منقول حرفيًّا من خط الأساس، وكل قيمة صلبة
   استُبدلت بمتغيّر توكن. صفر أرقام وألوان مكتوبة هنا.
   ══════════════════════════════════════════════════════════════ */
.app{
  position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  color:var(--s-ink);
  font-family:var(--c-font-ui);
  font-size:var(--c-base-size);
  line-height:var(--c-base-lh);
  font-variant-numeric:var(--c-numeric);
  background:var(--x-app-bg);
}
.app *{box-sizing:border-box}
.app .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.app .scroll::-webkit-scrollbar{width:0}

/* الترويسة */
.app .hd{background:var(--s-header-bg);padding:var(--c-hd-pt) var(--c-gutter) var(--c-hd-pb);
  border-bottom:var(--c-line-w) solid var(--s-line)}
.app .hd .r1{display:flex;align-items:center;gap:var(--c-hd-gap);min-height:var(--c-badge-size);
  flex-direction:var(--x-hd-dir);justify-content:var(--c-hd-justify)}
.app .wm{color:var(--s-brand-text);line-height:1;
  font-family:var(--c-wordmark-font);font-size:var(--c-wordmark-size);font-weight:var(--c-wordmark-weight);
  letter-spacing:var(--c-wordmark-tracking);margin-inline-end:var(--x-wm-comp);
  transform:translate(var(--c-wordmark-x),var(--c-wordmark-y))}
.app .hd .place{margin-inline-start:auto;font-size:var(--c-place-size);color:var(--s-ink3)}

/* الشارة */
.app .b8{display:grid;place-items:center;overflow:hidden;flex-shrink:0;
  font-size:var(--c-badge-size);width:1em;height:1em;border-radius:var(--c-badge-radius);
  background:linear-gradient(var(--c-badge-angle),var(--s-cream1),var(--s-cream2));
  box-shadow:inset 0 0 0 var(--c-badge-ring-w) var(--x-badge-ring),var(--x-badge-gloss);
  transform:translate(var(--c-badge-x),var(--c-badge-y))}
.app .b8 .stk{display:flex;flex-direction:var(--c-logo-stack);align-items:center;justify-content:center;
  gap:var(--c-logo-gap);line-height:1;direction:ltr;
  transform:translate(var(--c-logo-x),var(--c-logo-y))}
.app .b8 s{text-decoration:none;color:var(--s-brand);
  font-family:var(--c-digit-font);font-size:var(--c-digit-size);line-height:var(--c-digit-lh);
  font-weight:var(--c-digit-weight);font-variation-settings:var(--x-digit-vf)}
.app .b8 u{text-decoration:none;color:var(--s-brand);opacity:var(--c-logoword-opacity);
  font-family:var(--c-logoword-font);font-size:var(--c-logoword-size);font-weight:var(--c-logoword-weight);
  letter-spacing:var(--c-logoword-tracking);margin-inline-end:var(--x-lw-comp);
  font-variation-settings:var(--x-word-vf)}
.app .b8 svg{width:100%;height:100%;display:block}
.app .b8.sm{font-size:var(--c-badge-sm)}
.app .b8.big{font-size:var(--c-empty-badge)}
.app .b8.sm s{font-size:var(--x-digit-sm)}
.app .b8.sm u{font-size:var(--x-word-sm)}
.app .b8 img{width:100%;height:100%;object-fit:contain;padding:var(--c-uplogo-pad);
  transform:rotate(var(--c-uplogo-rot)) scale(var(--c-uplogo-scale));opacity:var(--c-uplogo-opacity)}
.app .b8.plain{background:none;box-shadow:none}
.app .b8.ring{background:none;box-shadow:inset 0 0 0 var(--c-badge-ring-w2) var(--s-brand)}
.app .b8.circle{border-radius:50%}

/* رجوع */
.app .back{display:flex;align-items:center;gap:var(--c-back-gap);
  padding:var(--c-back-pt) var(--c-gutter) var(--c-back-pb);background:var(--s-header-bg);
  font-size:var(--c-back-size);color:var(--s-ink2);width:100%;text-align:start;
  border-bottom:var(--c-line-w) solid var(--s-line)}
.app .back .a{font-size:var(--c-back-arrow);color:var(--s-brand-text)}

/* المجموعات */
.app .grp{display:flex;align-items:center;gap:var(--c-grp-gap);
  padding:var(--c-grp-pt) var(--c-gutter) var(--c-grp-pb);font-size:var(--c-grp-size);color:var(--s-ink2)}
.app .grp b{font-family:var(--c-grp-num-font);font-size:var(--c-grp-num-size);color:var(--s-brand-text);
  direction:ltr;font-weight:var(--c-grp-num-weight)}
.app .grp .ln{flex:1;height:var(--c-line-w);background:var(--s-line)}

/* الصف */
.app .rw{position:relative;display:flex;align-items:center;width:100%;text-align:start;
  min-height:var(--c-row-height);padding:0 var(--c-gutter);background:var(--s-surface);color:var(--s-ink);
  box-shadow:var(--x-row-shadow);transition:background var(--p-dur-fast);
  border-radius:var(--c-row-radius);margin:var(--c-row-margin);
  flex-direction:var(--x-row-dir)}
.app .rw:after{content:"";position:absolute;bottom:0;inset-inline-start:var(--c-row-divider-start);
  inset-inline-end:var(--c-row-divider-end);height:var(--c-line-w);background:var(--s-line);
  opacity:var(--c-row-divider-on)}
.app .rw:active{background:var(--s-surface-pressed)}
.app .rw:active .chip{transform:scale(var(--c-chip-press))}
.app .chip{width:var(--c-chip-size);height:var(--c-chip-size);flex:none;border-radius:var(--c-chip-radius);
  overflow:hidden;background:var(--s-chip-bg);
  box-shadow:inset 0 0 0 var(--c-chip-ring-w) var(--x-chip-ring),var(--x-chip-gloss);
  transition:transform var(--p-dur-fast)}
.app .mk{width:100%;height:100%;display:grid;place-items:center;text-align:center;line-height:1;
  padding:var(--c-mark-pad);font-size:var(--c-mark-size)}
.app .tx{flex:1;min-width:0;padding:0 var(--c-text-pad)}
.app .rw h4{margin:0;font-size:var(--c-name-size);font-weight:var(--c-name-weight);
  line-height:var(--c-name-lh);letter-spacing:var(--c-name-tracking);font-family:var(--c-name-font)}
.app .rw .m{font-size:var(--c-meta-size);color:var(--s-ink3);letter-spacing:var(--c-meta-tracking);
  margin-top:var(--c-meta-gap)}
.app .stt{flex:none;font-size:var(--c-status-size);font-weight:var(--c-status-weight);color:var(--s-state-closed);
  display:inline-flex;align-items:center;gap:var(--c-status-gap)}
.app .rw[data-ok="1"] .stt{color:var(--s-state-open)}
.app .rw[data-wt="1"] .stt{color:var(--s-state-wait)}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const round=(v,n)=>{const m=Math.pow(10,n==null?3:n);return Math.round(v*m)/m};
function toast(t){const u=$('#utoast');u.textContent=t;u.classList.add('on');clearTimeout(window._ut);
  window._ut=setTimeout(()=>u.classList.remove('on'),1800)}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function rgba(h,a){if(a>=1)return h;const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${round(a,3)})`}
function lum(h){const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){const l1=lum(a),l2=lum(b);return round((Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05),2)}
function hex2hsl(h){let[r,g,b]=hex2rgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let hu=0,s=0,l=(mx+mn)/2;const d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);
    hu=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hu*=60}
  return[hu,s*100,l*100]}
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return rgb2hex(f(0)*255,f(8)*255,f(4)*255)}
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* ══════════════════════════════════════════════════════════════
   ١) TOKENS — السجلّ. كل قيمة بصرية في التطبيق تسكن هنا.
   id → {t نوع, v قيمة, u وحدة, g مجموعة, l تسمية, ref ارتباط, ...}

   ══════════════════════════════════════════════════════════════ */
const TOK={}, ORDER=[];
function D(id,o){o.id=id;o.layer=id[0]==='p'?1:id[0]==='s'?2:3;TOK[id]=o;ORDER.push(id);return o}
const cssvar=id=>'--'+id.replace(/\./g,'-');

/* ── الطبقة ١: الأوليّات ── */
const RAMPS={
 maroon:{l:'العنابي',c:{0:'#fdf6f4',50:'#f7e4de',100:'#ecc7bc',200:'#dda394',300:'#c87e6b',400:'#b25b47',

 neutral:{l:'المحايد',c:{0:'#ffffff',50:'#faf6ee',100:'#f2ece1',200:'#ece5d8',300:'#dfd4c3',400:'#cbbda6',

  D(`p.${k}.${st}`,{t:'color',v:RAMPS[k].c[st],a:1,g:'ramp:'+k,l:`${RAMPS[k].l} ${st}`});

/* سلّم مسافات غير خطّي عمدًا (§١٢٫٥): قفزات درامية لا متساوية */
[2,4,6,10,14,20,28,40,56,80,112,140,180,232,300,380,480].forEach((v,i)=>
  D(`p.space.${i}`,{t:'dim',v:v,u:'px',g:'space',l:'مسافة '+i,min:0,max:520,step:1}));

  D(`p.radius.${k}`,{t:'dim',v:v,u:'px',g:'radius',l:'زاوية '+k,min:0,max:999,step:.5}));
[['xs',9.5],['sm',10.5],['s2',11.5],['md',12.5],['lg',13],['xl',16],['h3',18.5],['h2',23],['h1',26],['d1',86],['d2',132]]
  .forEach(([k,v])=>D(`p.size.${k}`,{t:'dim',v:v,u:'px',g:'size',l:'حجم '+k,min:6,max:220,step:.5}));

  D(`p.weight.${k}`,{t:'num',v:v,g:'weight',l:'وزن '+k,min:100,max:900,step:50}));

  D(`p.dur.${k}`,{t:'dur',v:v,u:'s',g:'dur',l:'مدّة '+k,min:0,max:4,step:.02}));
[['inout','cubic-bezier(.42,0,.58,1)'],['out','cubic-bezier(.22,.9,.3,1)'],['in','cubic-bezier(.5,0,1,.5)'],

  D(`p.ease.${k}`,{t:'ease',v:v,g:'ease',l:'منحنى '+k}));

/* ── الطبقة ٢: الدلاليّة ── */
const SEM=[['brand','لون العلامة','p.maroon.700'],['brand.text','نصّ العلامة','p.maroon.700'],
 ['brand.ink','حبر فوق العلامة','p.neutral.0'],['bg','خلفية التطبيق','p.neutral.0'],

 ['ink','الحبر','p.ink.800'],['ink2','الحبر ٢','p.ink.500'],['ink3','الحبر ٣','p.ink.300'],
 ['line','الخط','p.neutral.300'],['state.open','مفتوح','p.maroon.700'],['state.wait','فيه دور','p.ink.300'],
 ['state.closed','مغلق','p.ink.300'],['header.bg','خلفية الترويسة','p.neutral.50'],
 ['nav.bg','خلفية التبويب','p.neutral.50'],['ticket.bg','خلفية شريط الدور','p.maroon.700'],
 ['ticket.ink','حبر شريط الدور','p.neutral.0'],['chip.bg','خلفية شعار المطعم','p.neutral.0'],

/* توكنات الإزاحة الحرّة والبنية — تُنشأ عند الحاجة */
const FMKEYS=[];
function ensureFM(elid){
  const kx='c.fm.'+elid+'.x', ky='c.fm.'+elid+'.y';
  if(!TOK[kx]){D(kx,{t:'dim',v:0,u:'px',g:'freemove',l:'إزاحة '+elid+' أفقيًّا',min:-260,max:260,step:.5});
    D(ky,{t:'dim',v:0,u:'px',g:'freemove',l:'إزاحة '+elid+' رأسيًّا',min:-260,max:260,step:.5});FMKEYS.push(elid)}
  return[kx,ky]}

/* ══════════════════════════════════════════════════════════════
   ٢) محرّك التوكنات — القراءة والحلّ والحقن
   ══════════════════════════════════════════════════════════════ */
function raw(id){const t=TOK[id];if(!t)return'';return t.ref?raw(t.ref):t.v}
function alphaOf(id){const t=TOK[id];if(!t)return 1;return t.ref?alphaOf(t.ref):(t.a==null?1:t.a)}
function out(id){
  const t=TOK[id];if(!t)return'';
  const v=raw(id);
  switch(t.t){
    case'color':return rgba(v,alphaOf(id));
    case'dim':return t.u===''?String(v):v+t.u;
    case'dur':return v+'s';
    case'num':case'opacity':case'lh':return String(v);
    case'bool':return v?'1':'0';
    case'shadow':return v.length?v.map(s=>`${s.inset?'inset ':''}${s.x}px ${s.y}px ${s.b}px ${s.s}px ${rgba(s.c,s.a)}`).join(','):'none';
    default:return String(v);
  }
}
/* المتغيّرات المشتقّة: ما لا يُختزل في توكن واحد */
function texture(k,tintHex){
  const L=[],g=n=>+raw('c.tex.'+k+'.'+n);
  const gl=g('glow');if(gl>0)L.push(`radial-gradient(circle at 18% 12%,${rgba(tintHex,gl)},transparent 42%)`);
  const dg=g('diag');if(dg>0){const a=raw('c.tex.'+k+'.diag.angle'),s=+raw('c.tex.'+k+'.diag.size');
    L.push(`repeating-linear-gradient(${a}deg,${rgba(tintHex,dg)} 0 ${round(s*.4,2)}px,transparent ${round(s*.4,2)}px ${s}px)`)}
  const gr=g('grain');if(gr>0)L.push(`radial-gradient(rgba(0,0,0,${gr}) .7px,transparent .8px) 0 0/3px 3px`);
  const pa=g('paper');if(pa>0)L.push(`repeating-linear-gradient(0deg,${rgba(tintHex,pa)} 0 1px,transparent 1px 4px)`,
    `repeating-linear-gradient(90deg,${rgba(tintHex,pa*.6)} 0 1px,transparent 1px 6px)`);
  const li=g('linen');if(li>0)L.push(`repeating-linear-gradient(45deg,${rgba(tintHex,li)} 0 1px,transparent 1px 3px)`,
    `repeating-linear-gradient(-45deg,${rgba(tintHex,li)} 0 1px,transparent 1px 3px)`);
  return L}
const COMPUTED={
  '--x-app-bg':()=>[...texture('app',raw('s.brand')),out('s.bg')].join(','),
  '--x-row-tex':()=>{const t=texture('row',raw('s.brand'));return t.length?t.join(',')+','+out('s.surface'):out('s.surface')},
  '--x-hd-tex':()=>{const t=texture('header',raw('s.brand'));return t.length?t.join(',')+','+out('s.header-bg'):out('s.header-bg')},
  '--x-row-shadow':()=>{const S=TOK['c.row.shadow'].v;if(!S.length)return'none';
    const tint=+raw('c.shadow.tint');
    return S.map(s=>{const c=mixTint(s.c,tint);return`${s.inset?'inset ':''}${s.x}px ${s.y}px ${s.b}px ${s.s}px ${rgba(c,s.a)}`}).join(',')},
  '--x-button-shadow':()=>{const S=TOK['c.button.shadow'].v;if(!S.length)return'none';
    const tint=+raw('c.shadow.tint');
    return S.map(s=>{const c=mixTint(s.c,tint);return`${s.inset?'inset ':''}${s.x}px ${s.y}px ${s.b}px ${s.s}px ${rgba(c,s.a)}`}).join(',')},
  '--x-badge-ring':()=>rgba(raw('c.badge.ring.color'),alphaOf('c.badge.ring.color')),
  '--x-badge-gloss':()=>{const g=+raw('c.badge.gloss');return g>0?`inset 0 1px 0 rgba(255,255,255,${g})`:'0 0 0 0 transparent'},
  '--x-chip-ring':()=>rgba(raw('c.chip.ring.color'),alphaOf('c.chip.ring.color')),
  '--x-chip-gloss':()=>{const g=+raw('c.chip.gloss');return g>0?`inset 0 1px 0 rgba(255,255,255,${g})`:'0 0 0 0 transparent'},
  '--x-chip-tint':()=>rgba(raw('s.brand'),.09),
  '--x-wm-comp':()=>raw('c.wordmark.compensate')?(-raw('c.wordmark.tracking'))+'em':'0em',
  '--x-lw-comp':()=>(-raw('c.logoword.tracking'))+'em',
  '--x-digit-vf':()=>`"wght" ${raw('c.digit.weight')},"opsz" ${raw('c.digit.opsz')}`,
  '--x-word-vf':()=>`"wght" ${raw('c.logoword.weight')},"wdth" ${raw('c.logoword.wdth')}`,
  '--x-digit-sm':()=>round(+raw('c.digit.size')*1.0,4)+'em',
  '--x-word-sm':()=>round(+raw('c.logoword.size')*1.0,4)+'em',
  '--x-hd-dir':()=>raw('c.hd.reverse')?'row-reverse':'row',
  '--x-row-dir':()=>raw('c.row.reverse')?'row-reverse':'row',
  '--x-nav-dir':()=>raw('c.nav.reverse')?'row-reverse':'row',
  '--x-tick-dir':()=>raw('c.ticket.reverse')?'row-reverse':'row',
};
function mixTint(hex,t){/* يسحب الظلّ نحو لون العلامة بدل الأسود المحايد */
  const b=hex2rgb(hex),br=hex2rgb(raw('s.brand'));
  return rgb2hex(b[0]+(br[0]-b[0])*t*.35,b[1]+(br[1]-b[1])*t*.35,b[2]+(br[2]-b[2])*t*.35)}

let ROOTS=[];
function apply(target){
  const nodes=target?[target]:ROOTS;
  for(const n of nodes){
    for(const id of ORDER)n.style.setProperty(cssvar(id),out(id));
    for(const k in COMPUTED)n.style.setProperty(k,COMPUTED[k]());
    /* تكبير النص العام وكثافة الحبر */
    n.style.setProperty('--c-base-size',round(+raw('c.base.size')*(+raw('c.type.scale'))/100,3)+'px');
    n.style.setProperty('-webkit-font-smoothing',+raw('c.ink.density')>0?'auto':'antialiased');
  }
}
/* لقطة كاملة للحالة */
function snapshotState(){
  const o={tok:{},struct:JSON.parse(JSON.stringify(STRUCT)),content:JSON.parse(JSON.stringify(DATA)),
    strings:JSON.parse(JSON.stringify(STR)),sig:JSON.parse(JSON.stringify(SIG))};
  for(const id of ORDER){const t=TOK[id];o.tok[id]={v:t.v,a:t.a,ref:t.ref,u:t.u,exc:t.exc||false}}
  return o}
function restoreState(o,silent){
  for(const id in o.tok){
    if(!TOK[id]){/* توكن إزاحة حرّة أُنشئ لاحقًا */ const m=id.match(/^c\.fm\.(.+)\.(x|y)$/);if(m)ensureFM(m[1])}
    if(!TOK[id])continue;const s=o.tok[id],t=TOK[id];t.v=s.v;t.a=s.a;t.ref=s.ref;if(s.u!=null)t.u=s.u;t.exc=s.exc}
  if(o.struct)Object.assign(STRUCT,JSON.parse(JSON.stringify(o.struct)));
  if(o.content){DATA.length=0;JSON.parse(JSON.stringify(o.content)).forEach(x=>DATA.push(x))}
  if(o.strings)Object.assign(STR,o.strings);
  if(o.sig)Object.assign(SIG,o.sig);
  apply();render();buildPanel();if(!silent)refreshCode()}

/* ══════════════════════════════════════════════════════════════
   ٣) البنية — الفتحات والأجزاء (السحب، الإخفاء، الإدراج)
   ══════════════════════════════════════════════════════════════ */
const STRUCT={
  slots:{
    header:[{k:'wordmark',on:1},{k:'badge',on:1},{k:'place',on:1}],
    row:[{k:'chip',on:1},{k:'text',on:1},{k:'status',on:1}],
    nav:[{k:'list',on:1},{k:'turns',on:1},{k:'me',on:1}],
    end:[{k:'ghost',on:1},{k:'endtext',on:1}]
  },
  added:[],  /* {id,slot,kind,props,index} */
  removed:[] /* سجل ما أُخفي — للتصدير */
};
const PARTKINDS={
  text:{l:'نصّ',def:{text:'نصّ جديد'}}, sub:{l:'نصّ ثانوي',def:{text:'سطر ثانوي'}},
  num:{l:'رقم',def:{text:'٨'}}, badge:{l:'شارة الشعار',def:{}}, uplogo:{l:'شعار مرفوع',def:{}},
  icon:{l:'أيقونة',def:{text:'✦'}}, dot:{l:'نقطة حالة',def:{}}, chip:{l:'شريحة',def:{text:'جديد'}},
  btn:{l:'زر أساسي',def:{text:'زر'}}, gbtn:{l:'زر شبحي',def:{text:'زر شبحي'}},
  rule:{l:'فاصل خطّي',def:{}}, spacer:{l:'مساحة فارغة',def:{}}, img:{l:'صورة',def:{}},
  card:{l:'بطاقة',def:{text:'بطاقة'}}, kv:{l:'صف معلومات',def:{text:'تسمية',text2:'قيمة'}},
  head:{l:'مجموعة عنوان',def:{text:'عنوان'}}
};
let PARTSEQ=1;
function addPart(slot,kind){
  const id=kind+'-'+(PARTSEQ++);
  STRUCT.added.push({id:id,slot:slot,kind:kind,props:Object.assign({},PARTKINDS[kind].def)});
  STRUCT.slots[slot].push({k:'ins:'+id,on:1});
  push('إدراج '+PARTKINDS[kind].l);render();buildPanel()}
function delPart(slot,idx){
  const s=STRUCT.slots[slot],p=s[idx];
  if(p.k.startsWith('ins:')){const pid=p.k.slice(4);STRUCT.added=STRUCT.added.filter(a=>a.id!==pid);s.splice(idx,1)}
  else{p.on=0;if(!STRUCT.removed.find(r=>r.slot===slot&&r.k===p.k))STRUCT.removed.push({slot:slot,k:p.k})}
  push('حذف جزء');render();buildPanel()}
function togglePart(slot,idx){
  const p=STRUCT.slots[slot][idx];p.on=p.on?0:1;
  if(!p.on){if(!STRUCT.removed.find(r=>r.slot===slot&&r.k===p.k))STRUCT.removed.push({slot:slot,k:p.k})}
  else STRUCT.removed=STRUCT.removed.filter(r=>!(r.slot===slot&&r.k===p.k));
  push('إظهار/إخفاء');render();buildPanel()}
function movePart(slot,from,to){
  const s=STRUCT.slots[slot];if(to<0||to>=s.length||from===to)return;
  const[x]=s.splice(from,1);s.splice(to,0,x);push('إعادة ترتيب');render();buildPanel()}
function dupPart(slot,idx){
  const p=STRUCT.slots[slot][idx];if(!p.k.startsWith('ins:'))return;
  const src=STRUCT.added.find(a=>a.id===p.k.slice(4));const id=src.kind+'-'+(PARTSEQ++);
  STRUCT.added.push({id:id,slot:slot,kind:src.kind,props:Object.assign({},src.props)});
  STRUCT.slots[slot].splice(idx+1,0,{k:'ins:'+id,on:1});push('تكرار');render();buildPanel()}

function insHTML(p){
  const t=p.props.text||'',t2=p.props.text2||'';
  const D=`data-el="ins.${p.id}" data-part="${p.id}"`;
  switch(p.kind){
    case'text':return`<span class="ins-text" ${D}>${t}</span>`;
    case'sub':return`<span class="ins-sub" ${D}>${t}</span>`;
    case'num':return`<span class="ins-num" ${D}>${t}</span>`;
    case'badge':return BADGE('sm','ins.'+p.id);
    case'uplogo':return`<span class="b8 plain" ${D}>${raw('c.uplogo.src')?`<img src="${raw('c.uplogo.src')}" alt="">`:''}</span>`;
    case'icon':return`<span class="ins-icon" ${D}>${t}</span>`;
    case'dot':return`<span class="ins-dot" ${D}></span>`;
    case'chip':return`<span class="ins-chip" ${D}>${t}</span>`;
    case'btn':return`<span class="act" ${D}>${t}</span>`;
    case'gbtn':return`<span class="ghost" ${D}>${t}</span>`;
    case'rule':return`<i class="ins-rule" ${D}></i>`;
    case'spacer':return`<i class="ins-spacer" ${D}></i>`;
    case'img':return`<span class="ins-img" ${D}></span>`;
    case'card':return`<span class="ins-card" ${D}>${t}</span>`;
    case'kv':return`<span class="ins-kv" ${D}><span>${t}</span><span>${t2}</span></span>`;
    case'head':return`<span class="ins-head" ${D}>${t}</span>`;
    default:return''}}

    return map[p.k]!=null?map[p.k]:''}).join('')}

let HIST=[],HI=-1,SNAPS=[],REV=0,BASELINE=null,LOCKED={};
function push(label){
  const st=snapshotState();st._l=label;
  HIST=HIST.slice(0,HI+1);HIST.push(st);if(HIST.length>200)HIST.shift();HI=HIST.length-1;REV++;
  $('#revline').textContent='rev '+REV;save()}
function undo(){if(HI<=0)return toast('لا يوجد تراجع');HI--;restoreState(HIST[HI]);toast('تراجع: '+(HIST[HI]._l||''));save()}
function redo(){if(HI>=HIST.length-1)return toast('لا توجد إعادة');HI++;restoreState(HIST[HI]);toast('إعادة');save()}
let _sv;function save(){clearTimeout(_sv);_sv=setTimeout(()=>{
  try{localStorage.setItem('eight.studio.v1',JSON.stringify({s:snapshotState(),snaps:SNAPS,rev:REV,seq:PARTSEQ}))}catch(e){}},400)}
function load(){try{const j=JSON.parse(localStorage.getItem('eight.studio.v1'));if(!j)return false;
  SNAPS=j.snaps||[];REV=j.rev||0;PARTSEQ=j.seq||1;restoreState(j.s,true);return true}catch(e){return false}}
function snap(name){
  const n=name||prompt('اسم اللقطة؟','لقطة '+(SNAPS.length+1));if(!n)return;
  SNAPS.push({n:n,t:new Date().toLocaleString('ar-SA'),s:snapshotState()});save();buildPanel();toast('حُفظت اللقطة: '+n)}

function fieldFor(id,compact){
  const t=TOK[id];if(!t)return el('div');
  const wrap=el('div','row');
  const lab=el('label','', `<b>${t.l}</b>${t.exc?'<span class="exc">استثناء</span>':''}`);
  lab.title=id+(t.ref?'  ←  '+t.ref:'');
  lab.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(id);toast(id)};
  wrap.appendChild(lab);
  const c=el('div','ctl');
  const set=(v,a)=>{
    if(LOCKED[id])return toast('التوكن مقفل');
    t.ref=null;t.v=v;if(a!=null)t.a=a;
    if(t.min!=null&&t.t!=='color'){const inScale=(t.t==='dim')&&!!ORDER.find(k=>k.startsWith('p.space.')&&raw(k)===v);t.exc=t.exc||false}
    apply();refreshCode();save();drawSel()};
  if(t.t==='color'){
    const sw=el('input');sw.type='color';sw.value=raw(id);
    const hx=el('input','hex');hx.value=raw(id);
    const al=el('input');al.type='range';al.min=0;al.max=1;al.step=.01;al.value=alphaOf(id);al.style.width='60px';
    sw.oninput=()=>{hx.value=sw.value;set(sw.value)};
    hx.onchange=()=>{let v=hx.value.trim();if(/^#?[0-9a-f]{3,6}$/i.test(v)){if(v[0]!=='#')v='#'+v;sw.value=v;set(v)}else toast('لون غير صالح')};
    al.oninput=()=>set(raw(id),+al.value);
    c.append(sw,hx,al);
  }else if(t.t==='dim'){
    const r=el('input');r.type='range';r.min=t.min==null?0:t.min;r.max=t.max==null?100:t.max;r.step=t.step||1;r.value=+raw(id);
    const n=el('input','num');n.type='number';n.step=t.step||1;n.value=+raw(id);
    const u=el('select','uni');['px','rem','%','em','deg',''].forEach(x=>{const o=el('option');o.value=x;o.textContent=x||'—';
      if(x===t.u)o.selected=true;u.appendChild(o)});
    r.oninput=()=>{n.value=r.value;set(+r.value)};
    n.onchange=()=>{r.value=n.value;set(+n.value)};
    u.onchange=()=>{t.u=u.value;apply();refreshCode();save()};
    c.append(r,n,u);
  }else if(t.t==='num'||t.t==='opacity'||t.t==='lh'||t.t==='dur'){
    const r=el('input');r.type='range';r.min=t.min==null?0:t.min;r.max=t.max==null?1:t.max;r.step=t.step||.01;r.value=+raw(id);
    const n=el('input','num');n.type='number';n.step=t.step||.01;n.value=+raw(id);
    r.oninput=()=>{n.value=r.value;set(+r.value)};n.onchange=()=>{r.value=n.value;set(+n.value)};
    c.append(r,n);
  }else if(t.t==='bool'){
    const k=el('input');k.type='checkbox';k.className='chk';k.checked=!!raw(id);
    k.onchange=()=>{set(k.checked);render()};c.append(k);
  }else if(t.t==='enum'){
    const s=el('select','sel');t.opts.forEach(o=>{const op=el('option');op.value=o;op.textContent=o;
      if(o===raw(id))op.selected=true;s.appendChild(op)});
    s.onchange=()=>{set(s.value);render()};c.append(s);
  }else if(t.t==='font'){
    const s=el('select','sel');
    const FONTS=['IBM Plex Sans Arabic','Reem Kufi','Alexandria','Almarai','Cairo','Tajawal','Noto Kufi Arabic',
      'DM Serif Display','Literata','Archivo','Playfair Display','Prata','Bodoni Moda','Cormorant Garamond',
      'Inter','Work Sans','Space Grotesk','Fraunces'];
    FONTS.forEach(f=>{const o=el('option');o.value=`"${f}",${/Serif|Playfair|Prata|Bodoni|Cormorant|Literata|Fraunces/.test(f)?'serif':'sans-serif'}`;
      o.textContent=f;if(o.value===raw(id))o.selected=true;s.appendChild(o)});
    s.onchange=()=>{loadFont(s.options[s.selectedIndex].textContent);set(s.value);render()};c.append(s);
  }else if(t.t==='ease'){
    const s=el('select','sel');['cubic-bezier(.42,0,.58,1)','cubic-bezier(.22,.9,.3,1)','cubic-bezier(.5,0,1,.5)',
      'cubic-bezier(.2,1.3,.4,1)','linear'].forEach(v=>{const o=el('option');o.value=v;o.textContent=v;
      if(v===raw(id))o.selected=true;s.appendChild(o)});
    const bz=el('button','tbtn','منحنى');bz.onclick=()=>bezier(id);
    s.onchange=()=>set(s.value);c.append(s,bz);
  }else if(t.t==='shadow'){
    const b=el('button','tbtn','محرّر الظلّ ('+(raw(id).length)+')');b.onclick=()=>shadowEditor(id);c.append(b);
  }else{
    const i=el('input','txt');i.value=raw(id);i.style.width='150px';
    i.onchange=()=>{set(i.value);render()};c.append(i);
  }
  if(!compact){
    const lk=el('button','tbtn',LOCKED[id]?'🔒':'🔓');lk.style.padding='2px 5px';lk.title='قفل التوكن';
    lk.onclick=()=>{LOCKED[id]=!LOCKED[id];buildPanel()};c.append(lk);
  }
  wrap.appendChild(c);
  if(t.ref&&!compact){
    const src=el('div','mini',`من <code>${t.ref}</code> = <code>${out(t.ref)}</code> · <button class="lnk" data-un="${id}">فكّ الارتباط</button>`);
    src.querySelector('[data-un]').onclick=()=>{t.ref=null;push('فكّ ارتباط');buildPanel()};
    wrap.style.display='block';wrap.appendChild(src);
  }
  return wrap}
function section(title,open,count){
  const s=el('section','sec'+(open?'':' closed'));
  const h=el('h4','',`<span>${title}</span>`+(count!=null?`<span class="cnt">${count}</span>`:''));
  h.onclick=()=>s.classList.toggle('closed');
  const b=el('div','body');s.append(h,b);s.body=b;return s}

  const ids=ORDER.filter(id=>TOK[id].g===g);if(!ids.length)return;

  if(document.getElementById('gf-'+name))return;

  l.href='https://fonts.googleapis.com/css2?family='+name.replace(/ /g,'+')+':wght@100;200;300;400;500;600;700;800;900&display=swap';

const ALLOWED_INLINE=/^(width|height|margin|margin-top|padding|padding-top|padding-bottom|display|gap|grid|justify-items|align-items|flex|text-align|opacity|position|inset-inline-start|top|font-family|font-size|font-weight|color|background|border-bottom|letter-spacing|line-height|transform)$/;

    st.split(';').forEach(d=>{
      const i=d.indexOf(':');if(i<0)return;

        out.push({n:n,p:prop,v:val,t:'لون صلب'});

        out.push({n:n,p:prop,v:val,t:'مقاس بالبكسل'});
      else if(prop==='font-weight'&&/^\d+$/.test(val))
        out.push({n:n,p:prop,v:val,t:'وزن خطّ صلب'});
    })});

  if(sh.length&&sh.every(s=>{const[r,g,b]=hex2rgb(s.c);return Math.abs(r-g)<10&&Math.abs(g-b)<10})&&+raw('c.shadow.tint')<.15)

  const emo=$$('#app *').filter(n=>n.children.length===0&&/[\u{1F300}-\u{1FAFF}✀-➿]/u.test(n.textContent));
  if(emo.length)W.push({t:'اعتماد على إيموجي عامة ('+emo.length+') بدل علامات مرسومة.',sel:null});

  else if(CODETAB==='comp')s=componentsCSS();
  else if(CODETAB==='agent')s=agentPrompt();
  else{const rows=diffRows(DIFFBASE);
    s=rows.length?rows.map(r=>`${r[0]}\n   ${r[1]}  →  ${r[2]}`).join('\n'):'لا فرق.';}
  $('#code').textContent=s;
  $('#revline').textContent='rev '+REV+' · '+hashState()}

/* ══════════════════════════════════════════════════════════════
   ١٣) المسرح — لوح ومقارنة وتكبير
   ══════════════════════════════════════════════════════════════ */
let SHEET=false,ABON=false,PURE=false,ZOOM=1;
function layoutStage(){
  $('#single').classList.toggle('off',SHEET||ABON);
  $('#sheet').classList.toggle('on',SHEET);
  $('#abwrap').classList.toggle('on',ABON);
  if(SHEET)renderSheet();if(ABON)renderAB();}
function renderSheet(){
  const w=$('#sheet');w.innerHTML='';
  SCREENS.forEach(([k,l])=>{
    const c=el('div','cell');
    const f=el('div','frame '+($('#device').value||''));
    f.style.transform='scale(.62)';f.style.marginBottom='-320px';
    const a=el('div','app');a.innerHTML=screenHTML(k);
    f.appendChild(a);c.appendChild(f);c.appendChild(el('div','fcap',l));
    w.appendChild(c);ROOTS.push(a)});
  ROOTS=[$('#app')].concat($$('#sheet .app'),$$('#abwrap .app'));apply()}
function renderAB(){
  const w=$('#abwrap');w.innerHTML='';
  const mk=(label,st)=>{const c=el('div','cell');const f=el('div','frame '+($('#device').value||''));
    const a=el('div','app');
    if(st){const keep=snapshotState();restoreState(st,true);a.innerHTML=screenHTML(currentKey());
      const vals={};ORDER.forEach(id=>vals[cssvar(id)]=out(id));
      for(const k in COMPUTED)vals[k]=COMPUTED[k]();
      restoreState(keep,true);
      requestAnimationFrame(()=>{for(const k in vals)a.style.setProperty(k,vals[k])});
      a.dataset.frozen='1'}
    else a.innerHTML=screenHTML(currentKey());
    f.appendChild(a);c.appendChild(f);c.appendChild(el('div','fcap',label));return{c:c,a:a}};
  const before=mk('قبل — '+(ABBASE?'آخر لقطة':'خط الأساس'),ABBASE||BASELINE);
  const after=mk('بعد — الحالي',null);
  w.append(before.c,after.c);
  /* شريط انزلاق على شاشة واحدة */
  const sp=el('div','cell');const wrap=el('div','splitwrap');
  const f1=el('div','frame '+($('#device').value||''));const a1=el('div','app');a1.innerHTML=screenHTML(currentKey());
  f1.appendChild(a1);
  const ov=el('div','over');const f2=el('div','frame '+($('#device').value||''));
  f2.style.position='absolute';f2.style.inset='0';f2.style.border='0';
  const a2=el('div','app');
  {const keep=snapshotState();restoreState(ABBASE||BASELINE,true);a2.innerHTML=screenHTML(currentKey());
   const vals={};ORDER.forEach(id=>vals[cssvar(id)]=out(id));for(const k in COMPUTED)vals[k]=COMPUTED[k]();
   restoreState(keep,true);requestAnimationFrame(()=>{for(const k in vals)a2.style.setProperty(k,vals[k])});
   a2.dataset.frozen='1'}
  f2.appendChild(a2);ov.appendChild(f2);
  wrap.append(f1,ov);
  const hd=el('div','handle');hd.style.insetInlineStart='50%';wrap.appendChild(hd);
  ov.style.clipPath='inset(0 0 0 50%)';
  let drag=false;hd.onmousedown=()=>drag=true;
  document.addEventListener('mouseup',()=>drag=false);
  document.addEventListener('mousemove',e=>{if(!drag)return;const r=wrap.getBoundingClientRect();
    const p=clamp((e.clientX-r.left)/r.width*100,0,100);hd.style.insetInlineStart=p+'%';
    ov.style.clipPath=`inset(0 0 0 ${p}%)`});
  sp.append(wrap,el('div','fcap','شريط انزلاق — اسحب الخطّ'));
  w.appendChild(sp);
  ROOTS=[$('#app')].concat($$('#sheet .app'),$$('#abwrap .app:not([data-frozen])'));apply()}

/* ══════════════════════════════════════════════════════════════
   ١٤) التفاعل — التحديد، السحب الحرّ، الزحزحة
   ══════════════════════════════════════════════════════════════ */
$('#app').addEventListener('mouseover',e=>{if(!EDIT)return;const n=e.target.closest('[data-el]');hoverBox(n)});
$('#app').addEventListener('mouseleave',()=>hoverBox(null));
$('#app').addEventListener('click',e=>{
  if(EDIT){e.preventDefault();e.stopPropagation();
    const n=e.target.closest('[data-el]');if(!n)return;
    if(n.dataset.lock==='1')return toast('العنصر مقفل');
    if(MEASURE){MPICK.push(n);if(MPICK.length>2)MPICK=[n];drawSel();
      if(MPICK.length===2)toast('المسافة معروضة');return}
    selectEl(n,e.shiftKey);return}
  const b=e.target.closest('[data-rest],[data-go],[data-tab],[data-party]');if(!b)return;
  if(b.dataset.rest){S.rest=+b.dataset.rest;S.view='rest';return render()}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.view='list';return render()}
  if(b.dataset.party){S.party=clamp(S.party+ +b.dataset.party,1,12);return render()}
  const g=b.dataset.go;
  if(g==='back'){S.view=S.view==='confirm'?'rest':'list';return render()}
  if(g==='confirm'){S.view='confirm';return render()}
  if(g==='notify'){atoast('بننبّهك أول ما يفتح الباب');return}
  if(g==='take'){const x=DATA.find(r=>r.id===S.rest);
    S.ticket={name:x.n,code:'A'+(10+Math.floor(Math.random()*80)),ahead:x.q,start:Math.max(x.q,1),eta:x.m||5};
    S.view='ticket';S.tab='turns';render();setTimeout(()=>atoast('خذيت دورك — ننبّهك قبل دورك بعشر دقائق'),60);return}
  if(g==='ticket'){S.view='ticket';S.tab='turns';return render()}
  if(g==='advance'){if(!S.ticket)return;
    if(S.ticket.ahead>0){S.ticket.ahead--;S.ticket.eta=Math.max(1,S.ticket.eta-4);render();
      atoast(S.ticket.ahead===0?'أنت التالي — توجّه للباب':'تقدّم دورك، '+ANUM(S.ticket.ahead)+' قبلك')}
    else{S.done.unshift({name:S.ticket.name,code:S.ticket.code,note:'دخلت'});S.ticket=null;S.view='list';S.tab='turns';
      render();atoast('بالهناء والعافية')}return}
  if(g==='cancel'&&S.ticket){S.done.unshift({name:S.ticket.name,code:S.ticket.code,note:'ألغيت'});
    S.ticket=null;S.view='list';S.tab='turns';render();atoast('ألغينا دورك');return}
},true);
/* السحب الحرّ */
let DRAG=null;
$('#app').addEventListener('mousedown',e=>{
  if(!FREE||!EDIT)return;const n=e.target.closest('[data-el]');if(!n)return;
  const k=elName(n);ensureFM(k);
  DRAG={k:k,x0:e.clientX,y0:e.clientY,ox:+raw('c.fm.'+k+'.x'),oy:+raw('c.fm.'+k+'.y'),node:n};
  e.preventDefault();selectEl(n)});
document.addEventListener('mousemove',e=>{
  if(!DRAG)return;
  const snapg=e.altKey?1:(e.shiftKey?8:4);
  let dx=e.clientX-DRAG.x0,dy=e.clientY-DRAG.y0;
  dx=Math.round(dx/snapg)*snapg;dy=Math.round(dy/snapg)*snapg;
  TOK['c.fm.'+DRAG.k+'.x'].v=round(DRAG.ox-dx,1);/* RTL: يمين موجب */
  TOK['c.fm.'+DRAG.k+'.y'].v=round(DRAG.oy+dy,1);
  render();showSnapLines(DRAG.node)});
document.addEventListener('mouseup',()=>{if(DRAG){push('سحب حرّ: '+DRAG.k);DRAG=null;
  $$('.snapline',$('#ovl')).forEach(n=>n.remove());buildPanel()}});
function showSnapLines(node){
  $$('.snapline',$('#ovl')).forEach(n=>n.remove());
  const f=$('#frame').getBoundingClientRect(),r=node.getBoundingClientRect();
  const others=$$('#app [data-el]').filter(n=>n!==node);
  const edges=[['left',r.left],['right',r.right],['top',r.top],['bottom',r.bottom],
    ['cx',(r.left+r.right)/2],['cy',(r.top+r.bottom)/2]];
  others.forEach(o=>{const q=o.getBoundingClientRect();
    [[r.left,q.left,'v'],[r.right,q.right,'v'],[(r.left+r.right)/2,(q.left+q.right)/2,'v'],
     [r.top,q.top,'h'],[r.bottom,q.bottom,'h'],[(r.top+r.bottom)/2,(q.top+q.bottom)/2,'h']].forEach(([a,b,ax])=>{
      if(Math.abs(a-b)>1.2)return;const d=el('div','snapline');
      if(ax==='v')d.style.cssText=`left:${a-f.left}px;top:0;width:1px;height:100%`;
      else d.style.cssText=`top:${a-f.top}px;left:0;height:1px;width:100%`;
      $('#ovl').appendChild(d)})})}

/* ══════════════════════════════════════════════════════════════
   ١٥) لوحة الأوامر ومحرّرات مساعدة
   ══════════════════════════════════════════════════════════════ */
function openCmd(){
  $('#cmdk').classList.add('on');const q=$('#cmdq');q.value='';q.focus();fillCmd('')}
function fillCmd(v){
  const l=$('#cmdl');l.innerHTML='';
  const items=[];
  TABS.forEach(([k,lab])=>items.push({t:'لوحة: '+lab,id:k,go:()=>{TAB=k;buildTabs();buildPanel()}}));
  SCREENS.forEach(([k,lab],i)=>items.push({t:'شاشة: '+lab,id:String(i+1),go:()=>gotoScreen(k)}));
  KITS.forEach(k=>items.push({t:'طقم: '+k.l,id:k.k,go:()=>applyKit(k.k)}));
  ORDER.forEach(id=>items.push({t:TOK[id].l,id:id,go:()=>{
    const g=TOK[id].g;TAB=g==='semantic'||String(g).startsWith('ramp')?'color':
      String(g).startsWith('tex')?'surface':g==='logo'?'identity':'comp';buildTabs();buildPanel();
    setTimeout(()=>{const lab=[...$$('#cbody label')].find(x=>x.title&&x.title.startsWith(id));
      if(lab){lab.closest('.sec').classList.remove('closed');lab.scrollIntoView({block:'center'});
        lab.style.color='#fff';setTimeout(()=>lab.style.color='',1200)}},30)}}));
  const f=items.filter(x=>!v||x.t.includes(v)||x.id.includes(v)).slice(0,60);
  f.forEach((x,i)=>{const d=el('div','it'+(i===0?' on':''),`<span>${x.t}</span><span class="id">${x.id}</span>`);
    d.onclick=()=>{x.go();$('#cmdk').classList.remove('on')};l.appendChild(d)})}
$('#cmdq').oninput=e=>fillCmd(e.target.value.trim());
$('#cmdq').onkeydown=e=>{
  if(e.key==='Escape')return $('#cmdk').classList.remove('on');
  if(e.key==='Enter'){const on=$('#cmdl .it.on')||$('#cmdl .it');if(on)on.click()}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
    const its=$$('#cmdl .it'),i=its.findIndex(x=>x.classList.contains('on'));
    its.forEach(x=>x.classList.remove('on'));
    const n=clamp(i+(e.key==='ArrowDown'?1:-1),0,its.length-1);if(its[n]){its[n].classList.add('on');its[n].scrollIntoView({block:'nearest'})}}};
$('#cmdk').onclick=e=>{if(e.target.id==='cmdk')$('#cmdk').classList.remove('on')};
function bezier(id){
  const v=prompt('منحنى بيزييه — أربعة أرقام (x1,y1,x2,y2):',
    (raw(id).match(/\(([^)]+)\)/)||[,'0.42,0,0.58,1'])[1]);
  if(!v)return;TOK[id].v=`cubic-bezier(${v})`;push('منحنى');apply();refreshCode();buildPanel()}
function shadowEditor(id){TAB='shadow';buildTabs();buildPanel()}
function gotoScreen(k){
  if(k==='rest'){S.view='rest';S.rest=S.rest||4}
  else if(k==='confirm'){S.view='confirm';S.rest=S.rest||4}
  else if(k==='ticket'){S.view='ticket';if(!S.ticket)S.ticket={name:DATA[3].n,code:'A47',ahead:2,start:4,eta:8}}
  else if(k==='turns'){S.tab='turns';S.view='list'}
  else if(k==='me'){S.tab='me';S.view='list'}
  else{S.tab='list';S.view='list'}
  render();buildScreens();refreshCode()}
function buildScreens(){
  const w=$('#screens');w.innerHTML='';const cur=currentKey();
  SCREENS.forEach(([k,l],i)=>{const b=el('button','pill'+(k===cur?' on':''),l+' '+(i+1));
    b.onclick=()=>gotoScreen(k);w.appendChild(b)})}

/* ══════════════════════════════════════════════════════════════
   ١٦) الشريط العلوي والاختصارات
   ══════════════════════════════════════════════════════════════ */
$('#bEdit').onclick=()=>{EDIT=!EDIT;$('#bEdit').classList.toggle('on',EDIT);
  document.body.classList.toggle('editing',EDIT);if(!EDIT){selectEl(null);hoverBox(null)}
  toast(EDIT?'وضع التحرير — اضغط أي عنصر':'وضع الاستخدام')};
$('#bFree').onclick=()=>{FREE=!FREE;$('#bFree').classList.toggle('on',FREE);
  document.body.classList.toggle('freemove',FREE);
  if(FREE&&!EDIT)$('#bEdit').click();
  toast(FREE?'وضع حرّ — اسحب العنصر (Shift ٨بكسل · Alt بلا التصاق)':'أُطفئ الوضع الحرّ')};
$('#bSheet').onclick=()=>{SHEET=!SHEET;if(SHEET)ABON=false;$('#bSheet').classList.toggle('on',SHEET);
  $('#bAB').classList.remove('on');layoutStage()};
$('#bAB').onclick=()=>{ABON=!ABON;if(ABON)SHEET=false;$('#bAB').classList.toggle('on',ABON);
  $('#bSheet').classList.remove('on');layoutStage()};
$('#bPure').onclick=()=>{PURE=!PURE;$('#insp').classList.toggle('collapsed',PURE);
  $('#ctrl').classList.toggle('collapsed',PURE);$('#bPure').classList.toggle('on',PURE)};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bSnap').onclick=()=>snap();
$('#bCmd').onclick=openCmd;
$('#bExport').onclick=()=>{navigator.clipboard.writeText(agentPrompt());toast('نُسخ AGENT PROMPT')};
$('#bLayers').onclick=()=>{TREEMODE=!TREEMODE;buildInspector()};
$('#bCopy').onclick=()=>{navigator.clipboard.writeText($('#code').textContent);toast('نُسخ')};
$('#bFull').onclick=()=>{FULL=!FULL;$('#bFull').classList.toggle('on',FULL);refreshCode()};
['scColors','scType','scLayout'].forEach(k=>$('#'+k).onchange=refreshCode);
$('#device').onchange=()=>{const v=$('#device').value;
  $('#frame').className='frame '+v;layoutStage();drawOverlays()};
$('#zoom').oninput=()=>{ZOOM=+$('#zoom').value/100;$('#zoomv').textContent=$('#zoom').value+'%';
  $('#stage').style.transform='scale('+ZOOM+')';$('#stage').style.marginBottom=(ZOOM<1?0:(ZOOM-1)*900)+'px'};
$$('.rsz').forEach(r=>{r.onmousedown=e=>{
  const t=$('#'+r.dataset.rsz),sx=e.clientX,sw=t.offsetWidth,dir=r.dataset.rsz==='insp'?-1:1;
  const mm=ev=>{t.style.width=clamp(sw+dir*(ev.clientX-sx)*(document.dir==='rtl'?-1:1),200,640)+'px'};
  const mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu)};
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);e.preventDefault()}});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();return openCmd()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();return e.shiftKey?redo():undo()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){e.preventDefault();
    if(SEL.length){const k=elName(SEL[0]);for(const sl in STRUCT.slots){
      const i=STRUCT.slots[sl].findIndex(p=>p.k==='ins:'+(k.split('.')[1]||''));if(i>=0)return dupPart(sl,i)}}
    return toast('التكرار متاح للأجزاء المُدرَجة')}
  if(typing)return;
  if(e.key==='Escape'){selectEl(null);MPICK=[];drawSel();return}
  if(e.key.toLowerCase()==='e')return $('#bEdit').click();
  if(e.key.toLowerCase()==='p')return $('#bPure').click();
  if(e.key.toLowerCase()==='c')return $('#bAB').click();
  if(e.key.toLowerCase()==='s')return snap();
  if(e.key.toLowerCase()==='x')return $('#bExport').click();
  if(e.key.toLowerCase()==='g'){OVL.grid8=!OVL.grid8;drawOverlays();return}
  if(/^[1-6]$/.test(e.key))return gotoScreen(SCREENS[+e.key-1][0]);
  if(e.key.startsWith('Arrow')&&SEL.length){
    const step=e.shiftKey?10:1;const k=elName(SEL[0]);ensureFM(k);
    const ax=e.key==='ArrowLeft'||e.key==='ArrowRight'?'x':'y';
    const dir=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1;
    TOK['c.fm.'+k+'.'+ax].v=round(+raw('c.fm.'+k+'.'+ax)+dir*step,1);
    e.preventDefault();render();refreshCode()}});

/* ══════════════════════════════════════════════════════════════
   ١٧) الإقلاع
   ══════════════════════════════════════════════════════════════ */
let BASELINE_CONTENT=null;
function boot(){
  ROOTS=[$('#app')];
  apply();render();
  BASELINE=snapshotState();BASELINE._l='خط الأساس';
  BASELINE_CONTENT=snapshotState();
  HIST=[BASELINE];HI=0;
  const restored=load();
  if(restored){apply();render()}
  buildTabs();buildPanel();buildInspector();buildScreens();refreshCode();
  layoutStage();drawOverlays();
  const ro=new ResizeObserver(()=>{drawSel();});ro.observe($('#app'));
  setInterval(()=>{if(SEL.length)drawSel()},600);
  if(!restored)toast('خط الأساس محمّل · اضغط E للتحرير');
  else toast('استُعيد عملك المحفوظ · rev '+REV);
}
boot();
</script>
