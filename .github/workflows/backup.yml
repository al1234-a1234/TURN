# ============================================================================
#  النسخة الاحتياطية اليومية الآلية — تعمل على GitHub Actions بلا يد بشرية.
#
#  لماذا هنا؟ استقلال حقيقي: النسخة تُحفظ عند GitHub لا عند Supabase،
#  فمشكلة مع المزوّد (حساب، سياسات، انقطاع) لا تمسّ نسختك. والفشل يصل
#  للمالك بريدًا تلقائيًّا من GitHub بلا أي إعداد إضافي.
#
#  الأمان — اقرأ هذا جيدًا:
#  المستودع عامّ، وأرشيفات Actions في المستودعات العامة يمكن لأي حساب
#  تنزيلها. لذلك النسخة تُشفَّر AES-256 قبل الرفع، ومفتاح فكّها
#  (BACKUP_PASSPHRASE) لا يعرفه إلا صاحب المستودع — بلا المفتاح الملف
#  حثالة بايتات لا تنفع أحدًا. لا تفقد المفتاح: نسخة بلا مفتاحها = لا نسخة.
#
#  يتطلّب سرّين في Settings → Secrets and variables → Actions:
#    SUPABASE_DB_PASSWORD  كلمة سرّ قاعدة البيانات وحدها (لا الرابط) — من
#                          Supabase → Connect → Reset database password.
#                          الرابط يُركَّب في مجرى العمل ويُرمَّز ترميزًا مئويًّا،
#                          فالرموز الخاصة والمسافات لا تكسره.
#    BACKUP_PASSPHRASE     عبارة سرّية طويلة تخترعها — اكتبها في «خزنة الشركة»
#
#  (يبقى SUPABASE_DB_URL مقبولًا للتوافق: رابط Session pooler كاملًا.)
#
#  فكّ النسخة على أي جهاز:
#    openssl enc -d -aes-256-cbc -pbkdf2 -in turn-backup-<تاريخ>.tar.enc \
#      -pass pass:'<العبارة>' | tar -x
#    ثم اتبع docs/RESTORE.md.
# ============================================================================
name: نسخة احتياطية يومية

on:
  schedule:
    - cron: "30 1 * * *"   # ٠٤:٣٠ فجرًا بتوقيت الرياض — بعد هدوء الليل
  workflow_dispatch: {}     # وتشغيل يدوي من تبويب Actions للاختبار

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # قاعدةٌ نظيفة بجانب المهمّة: النسخة تُستعاد فيها فعلًا لا يُتحقَّق من
    # شكلها فحسب. هذا هو الفرق بين «الملف يبدو صحيحًا» و«الملف يُستعاد».
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: التحقق من الأسرار وتركيب رابط الاتصال
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$PASS" ] || { echo "::error::السرّ BACKUP_PASSPHRASE غير مضبوط — أضِفه في Settings → Secrets → Actions"; exit 1; }

          # الطريق المفضَّل: كلمة سرّ فقط. الرابط يُركَّب هنا فلا يخطئ أحد في
          # تركيبه بيده — مسافة زائدة أو رمز غير مرمَّز كانا يُسقطان النسخة
          # بخطأ مبهم («تعذّر الاتصال بمقبس محلي») لا يدلّ على سببه.
          if [ -n "$DB_PASSWORD" ]; then
            ENC="$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"].strip(),safe=""))')"
            URL="postgresql://postgres.nkdfxmjuigslmangzuua:${ENC}@aws-0-eu-central-1.pooler.supabase.com:5432/postgres"
            echo "▸ الرابط مُركَّب من SUPABASE_DB_PASSWORD"
          elif [ -n "$DB" ]; then
            # توافق مع الإعداد القديم: رابط كامل — تُقلَّم منه الفراغات فقط.
            URL="$(printf '%s' "$DB" | tr -d '[:space:]')"
            echo "▸ الرابط مأخوذ من SUPABASE_DB_URL"
          else
            echo "::error::أضِف SUPABASE_DB_PASSWORD (كلمة سرّ قاعدة البيانات) في Settings → Secrets → Actions"
            exit 1
          fi

          case "$URL" in
            postgresql://*@*.pooler.supabase.com:5432/postgres) : ;;
            *) echo "::error::شكل الرابط غير صالح — تأكّد أن السرّ يحوي كلمة السرّ وحدها لا الرابط كاملًا"; exit 1 ;;
          esac

          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"

      - name: تثبيت عميل Postgres 17 (إصدار الخادم)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          # عامل التشغيل يأتي بنسخة عميل قديمة على /usr/bin مسبقًا (عادة v16)،
          # والتثبيت أعلاه لا يستبدلها تلقائيًّا — نضيف مسار v17 الحقيقي
          # أول PATH لبقية الخطوات كي تُستخدم نسخته لا نسخة النظام الافتراضية.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version

      - name: تشغيل النسخة (نفس سكربت الاستقلال اليدوي)
        env:
          SUPABASE_DB_URL: ${{ env.DB_URL }}
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh ./backups

      - name: تشفير AES-256 ثم إزالة النص الصريح
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP="$(ls ./backups | head -1)"
          tar -C ./backups -cf - "$STAMP" \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE \
            -out "turn-backup-$STAMP.tar.enc"
          rm -rf ./backups
          ls -lh turn-backup-*.tar.enc

      # نسخة لم تُفتح مرّة ليست نسخة، بل افتراض. هنا تُفكّ فورًا ويُتحقَّق من
      # محتواها — فيوم الحاجة لا يكون أوّل يوم نكتشف فيه أن الملف حثالة.
      - name: التحقّق من النسخة (فكّ فعليّ وجرد)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p /tmp/verify
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE \
            -in turn-backup-*.tar.enc | tar -x -C /tmp/verify \
            || { echo "::error::تعذّر فكّ التشفير — العبارة السرّية لا تطابق الملف"; exit 1; }

          DIR="$(find /tmp/verify -mindepth 1 -maxdepth 1 -type d | head -1)"
          [ -n "$DIR" ] || { echo "::error::الأرشيف فُكّ فارغًا"; exit 1; }

          gunzip -f "$DIR"/*.sql.gz

          # البنية: جداول المنتج الحرجة موجودة فعلًا لا مجرّد ملف بحجم معقول.
          for T in restaurants branches waitlist_entries customers customer_rewards; do
            grep -q "CREATE TABLE public\.$T" "$DIR/01-schema.sql" \
              || { echo "::error::جدول $T مفقود من نسخة البنية"; exit 1; }
          done

          # سياسات RLS: نسخة بلا سياسات تُسترجَع مكشوفة للعالم.
          POL="$(grep -c 'CREATE POLICY' "$DIR/01-schema.sql" || true)"
          [ "$POL" -ge 20 ] \
            || { echo "::error::سياسات RLS في النسخة $POL فقط — متوقَّع ٢٠ فأكثر"; exit 1; }

          # الصفوف: نسخة فارغة تنجح تقنيًّا وتخذلك يوم الاسترجاع.
          ROWS="$(awk -F',' '{s+=$2} END {print s+0}' "$DIR/04-rowcounts.csv")"
          [ "$ROWS" -ge 100 ] \
            || { echo "::error::مجموع الصفوف $ROWS — النسخة شبه فارغة"; exit 1; }

          echo "✓ فحص المحتوى: $POL سياسة، $ROWS صفًّا، وكل الجداول الحرجة حاضرة"
          echo "VERIFY_DIR=$DIR" >> "$GITHUB_ENV"

      # ══ الاسترجاع الفعليّ ══
      # الخطوة السابقة تقرأ الملف؛ هذه تُحمّله في قاعدةٍ حقيقية وتستعلمه.
      # نسخةٌ تُقرأ ولا تُستعاد قد تخذلك بعمودٍ مفقود أو قيدٍ يرفض بياناته،
      # ولا يُكتشف ذلك إلا يوم الكارثة — وهو أسوأ يومٍ للاكتشاف.
      - name: استرجاع النسخة في قاعدة نظيفة ثم مقارنتها بالجرد
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: restore_test
        run: |
          set -Eeuo pipefail
          DIR="$VERIFY_DIR"

          # أدوار Supabase غير موجودة في بوستجرس النظيف، وسياسات RLS تشير
          # إليها بالاسم. ننشئها فارغة كي تُحمَّل السياسات كما هي.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare r text;
          begin
            foreach r in array array['anon','authenticated','service_role','authenticator',
                                     'supabase_admin','supabase_auth_admin','supabase_storage_admin',
                                     'dashboard_user','pgbouncer','supabase_read_only_user']
            loop
              begin execute format('create role %I nologin', r);
              exception when duplicate_object then null; end;
            end loop;
          end $$;
          create schema if not exists auth;
          create schema if not exists extensions;
          SQL

          # ‏ON_ERROR_STOP=0 عمدًا: امتدادات المزوّد (pg_cron، vault، graphql)
          # لا وجود لها في صورةٍ نظيفة، وأسطرها ستفشل ولا تعني فساد النسخة.
          # الحكم على النتيجة لا على عدد الأسطر التي اشتكت.
          echo "▸ تحميل البنية…"
          psql -q -v ON_ERROR_STOP=0 -f "$DIR/01-schema.sql" 2> /tmp/schema.err || true

          # الأخطاء تُطبع لا تُخبّأ: أوّل تشغيلٍ لهذا الاختبار فشل بلا جداول،
          # وكانت رسائله محبوسة في ملفٍ لم يُقرأ — فضاع التشخيص مع الفشل.
          CREATED="$(psql -Atc "select count(*) from pg_tables where schemaname='public'")"
          echo "▸ جداول أُنشئت: $CREATED"
          if [ "$CREATED" -lt 10 ]; then
            echo "::group::أوّل ٤٠ خطأً من تحميل البنية"; head -40 /tmp/schema.err; echo "::endgroup::"
            echo "::group::أوّل ٢٠ سطرًا من ملف البنية"; head -20 "$DIR/01-schema.sql"; echo "::endgroup::"
            echo "::error::البنية لم تُستعد ($CREATED جدولًا) — الاسترجاع غير ممكن"
            exit 1
          fi

          echo "▸ تحميل البيانات…"
          psql -q -v ON_ERROR_STOP=0 -f "$DIR/02-data-public.sql" 2> /tmp/data.err || true
          echo "::group::أبرز أخطاء تحميل البيانات (إن وُجدت)"; grep -m 15 'ERROR' /tmp/data.err || echo "بلا أخطاء"; echo "::endgroup::"

          echo "▸ المقارنة بالجرد المحفوظ…"
          FAIL=0
          while IFS=',' read -r T EXPECTED; do
            [ -n "$T" ] || continue
            [ "$EXPECTED" -gt 0 ] 2>/dev/null || continue
            ACTUAL="$(psql -Atc "select count(*) from public.\"$T\"" 2>/dev/null || echo MISSING)"
            if [ "$ACTUAL" = "MISSING" ]; then
              echo "::error::جدول $T لم يُستعد إطلاقًا"; FAIL=1; continue
            fi
            # فرقٌ يسير مقبول: الجرد من pg_stat_user_tables وهو تقديريّ،
            # والنسخة تُؤخذ بعده بثوانٍ. الفرق الكبير خللٌ حقيقي.
            LO=$(( EXPECTED * 90 / 100 ))
            if [ "$ACTUAL" -lt "$LO" ]; then
              echo "::error::$T استُعيد بـ$ACTUAL صفًّا والمتوقَّع ~$EXPECTED"; FAIL=1
            else
              printf '  ✓ %-24s %s/%s\n' "$T" "$ACTUAL" "$EXPECTED"
            fi
          done < "$DIR/04-rowcounts.csv"

          # واستعلامٌ حقيقيّ عبر ثلاثة جداول: البنية مترابطة لا أكوامًا منفصلة
          JOINED="$(psql -Atc "select count(*) from public.waitlist_entries w
                                 join public.branches b on b.id = w.branch_id
                                 join public.restaurants r on r.id = b.restaurant_id")"
          echo "  ✓ استعلام مترابط عبر ٣ جداول: $JOINED صفًّا"
          [ "$JOINED" -gt 0 ] || { echo "::error::الاسترجاع لا يُنتج بيانات مترابطة"; FAIL=1; }

          POL="$(psql -Atc "select count(*) from pg_policies where schemaname='public'")"
          echo "  ✓ سياسات RLS بعد الاسترجاع: $POL"
          [ "$POL" -ge 20 ] || { echo "::error::سياسات RLS لم تُستعد ($POL)"; FAIL=1; }

          [ "$FAIL" -eq 0 ] || { echo "::error::فشل اختبار الاسترجاع"; exit 1; }
          echo "✓ الاسترجاع نجح فعليًّا في قاعدةٍ نظيفة"
          rm -rf /tmp/verify

      - name: رفع النسخة المشفَّرة (تُحفظ ٩٠ يومًا)
        uses: actions/upload-artifact@v4
        with:
          name: turn-backup-${{ github.run_id }}
          path: turn-backup-*.tar.enc
          retention-days: 90
          if-no-files-found: error
