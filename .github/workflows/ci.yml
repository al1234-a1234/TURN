# ============================================================================
#  حارس الجودة الآلي — يفحص كل دفعة كود قبل أن تمسّ الإنتاج بلا يد بشرية.
#
#  لماذا؟ حتى الآن كانت الدفعة تذهب لـVercel مباشرة: فحص الأنواع والأسلوب
#  والاختبارات الـ١٨ تعمل فقط إذا شغّلها أحد يدويًّا. هذا الروبوت يشغّلها
#  على كل دفعة، وفشلُ أيٍّ منها يصل المالك بريدًا تلقائيًّا من GitHub
#  (بلا أي إعداد) وتظهر ✗ حمراء على الكومِت.
#
#  ولا يحتاج أي أسرار — حتى وهو يبني: `.env.production` متعقَّبٌ في المستودع
#  عمدًا ولا يحمل إلا مفاتيح عامّة (publishable) ثلاثة، والحماية الحقيقية
#  بـRLS في Supabase لا بإخفائها.
#
#  ويبني نسخة الإنتاج فعلًا منذ اليوم. كان لا يفعل، وكان ذلك مقبولًا ما دامت
#  كل دفعةٍ إلى فرع العمل تُنتج معاينةً في Vercel تبني وتُبلّغ عند الفشل. ثمّ
#  أُوقفت معاينات `claude/**` توفيرًا لوقت البناء (vercel.json)، فلم يبقَ أيّ
#  بناءٍ آليّ على فرع العمل — ويصير خطأُ بناءٍ لا يُكتشف إلا لحظة الدمج على
#  main، أي على الإنتاج مباشرةً. فانتقل البناء إلى هنا حيث لا يمسّ شيئًا.
# ============================================================================
name: حارس الجودة

on:
  push:
    branches: ["main", "claude/**"]
  pull_request: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # ‏١٥ لا ١٠: البناء أضاف ≈دقيقةً محلّيًّا وعدّاءُ GitHub أبطأ. والمهلة سقفٌ
    # لهروبٍ لا ميزانيةَ وقت — ورفعُها أرخص من فحصٍ يحمرّ لأنّه لم يلحق.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: تثبيت الحزم
        run: npm ci
      - name: فحص الأنواع (TypeScript)
        run: npx tsc --noEmit
      - name: فحص الأسلوب (ESLint)
        run: npm run lint
      - name: الاختبارات (١٨ فحصًا حرجًا)
        run: npm test

      # ══ حارس الحمولة: لا مفتاح خدمةٍ في شاشات الموظّف ══
      #
      # صفحات اللوحة والاستقبال والأدمِن تُصيَّر على الخادم، وما تجلبه يُرسل
      # في حمولة RSC كاملًا — لا ما تعرضه العين فقط. فما دامت كلّها تجلب
      # بجلسة المستخدم، فـRLS يحكم كل صفٍّ يصل المتصفّح، ولا تسريب ولو
      # أخفت الواجهة زرًّا أو عمودًا.
      #
      # ويكفي `import { createAdminClient }` واحدٌ في تعديلٍ مستقبليّ ليصير
      # التصيير بمفتاحٍ يتخطّى RLS، فتحمل الحمولة صفوف فروعٍ ومطاعم أخرى
      # بينما الشاشة تبدو سليمة — عطبٌ لا تلتقطه عينٌ ولا اختبار واجهة.
      #
      # فحصٌ نصّيّ لا أداة: لا يحتاج تثبيتًا ولا يخطئ، وسببه مكتوبٌ فيه.
      - name: حارس الحمولة (لا مفتاح خدمة في اللوحة والاستقبال والأدمِن)
        run: |
          HITS=$(grep -rn "createAdminClient\|guestWriter\|SUPABASE_SERVICE_ROLE_KEY" \
                   src/app/dashboard src/app/reception src/app/admin 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::عميلٌ يتخطّى RLS داخل شاشات الموظّف — حمولة RSC تصير خارج حكم RLS:"
            echo "$HITS"
            echo "الصواب: اجلب بجلسة المستخدم (@/lib/supabase/server). وإن لزم مفتاح الخدمة"
            echo "حقًّا، فليكن خلف دالّة SECURITY DEFINER تفحص الملكيّة بنفسها — كـstaff_branch_queue."
            exit 1
          fi
          echo "✓ لا مفتاح خدمة تحت المسارات الثلاثة"

      # ══ البناء — آخرًا لأنه الأبطأ: ما قبله يسقط في ثوانٍ ══
      #
      # ‏tsc يفحص الأنواع ولا يبني: أخطاء التجميع والتوليد المسبق لا يراها.
      # وهذا ما يُلتقط هنا — استيرادٌ دائريّ، وسمٌ خادميّ في مكوّن عميل،
      # ‏`cookies()` في صفحةٍ ساكنة، وحزمةٌ لا تُحلّ وقت البناء.
      #
      # ولا يحتاج قاعدةً حيّة: مواضع القراءة الثلاثة وقت البناء محروسةٌ كلّها
      # (‏page.tsx بـtry/catch، وgenerateStaticParams بـtry/catch، وsitemap.ts
      # بـcatch) — فانقطاع Supabase يعطي قائمةً فارغةً لهذا البناء ولا يُحمّر
      # الفحص. أي أنّ هذه الخطوة لا تربط سلامة CI بتوفّر الإنتاج.
      - name: بناء نسخة الإنتاج (Next)
        run: npm run build

      # ── فشل أي خطوة أعلاه يصل تلغرام فورًا، لا بريد GitHub وحده ──
      - name: تنبيه تلغرام عند الفشل
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ] || { echo "::notice::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID غير مضبوطين — تُخطّى التنبيه."; exit 0; }
          MSG="🔴 حارس الجودة فشل — الفرع ${{ github.ref_name }}"$'\n'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" || true
